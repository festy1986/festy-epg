name: Combined FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
      timezone: "America/New_York"
    - cron: '0 12 * * *'
      timezone: "America/New_York"

permissions:
  contents: write


jobs:
  build-combinedfast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for other repository workflows
        run: |
          echo "Waiting before starting Combined FAST processing..."
          sleep 60

      - name: Download fresh Jessman FAST guide
        run: |
          mkdir -p combinedfast/source
          mkdir -p combinedfast/work
          mkdir -p guides

          curl -L --fail --retry 5 --retry-all-errors --retry-delay 15 \
            https://epg.guru/7daygracenote/USFast.xml \
            -o combinedfast/source/jessman.xml

          test -s combinedfast/source/jessman.xml

          echo "Fresh Jessman FAST guide downloaded"
          ls -lh combinedfast/source/jessman.xml

      - name: Download fresh IPTV-org guide
        run: |
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 15 \
            https://iptv-epg.org/files/epg-us.xml.gz \
            -o combinedfast/source/iptvorg.xml.gz

          test -s combinedfast/source/iptvorg.xml.gz

          echo "Fresh IPTV-org FAST guide downloaded"
          ls -lh combinedfast/source/iptvorg.xml.gz

      - name: Process and rebuild Combined FAST guide
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          cat > /tmp/build_combinedfast.js <<'EOF'
          const fs = require('fs')
          const readline = require('readline')
          const zlib = require('zlib')

          const jessmanPath =
            'combinedfast/source/jessman.xml'

          const iptvOrgPath =
            'combinedfast/source/iptvorg.xml.gz'

          const outputPath =
            'combinedfast/work/combinedfast.xml'

          const now =
            new Date()

          const pastCutoff =
            new Date(
              now.getTime() -
              3 *
              24 *
              60 *
              60 *
              1000
            )

          const cutoff =
            new Date(
              now.getTime() +
              7 *
              24 *
              60 *
              60 *
              1000
            )

          const jessmanChannels = {
            'FilmRise Horror': {
              displayName:
                'FilmRise Horror'
            },

            'Scream Factory TV': {
              displayName:
                'Scream Factory TV'
            },

            'MGM Presents': {
              displayName:
                'MGM Presents 2'
            },

            'Scares by Shudder': {
              displayName:
                'Scares by Shudder 2'
            },

            'Screambox TV': {
              displayName:
                'Screambox TV 2'
            },

            'Universal Monsters': {
              displayName:
                'Universal Monsters 2'
            },

            'Miramax Movie Channel': {
              displayName:
                'Miramax Movie Channel 2'
            }
          }

          const iptvOrgChannels = {
            'MGMPresents.us': {
              displayName:
                'MGM Presents'
            },

            'MGMPresentsAction.us': {
              displayName:
                'MGM Presents Action'
            },

            'MGMPresentsHorror.us': {
              displayName:
                'MGM Presents Horror'
            },

            'ScaresbyShudder.us': {
              displayName:
                'Scares by Shudder'
            },

            'ScreamboxTV.us': {
              displayName:
                'Screambox TV'
            },

            'UniversalMonsters.pluto': {
              displayName:
                'Universal Monsters'
            },

            'MiramaxMovieChannel.us': {
              displayName:
                'Miramax Movie Channel'
            }
          }

          const jessman =
            new Map()

          const iptvOrg =
            new Map()

          const channelHeaders =
            new Map()

          const jessmanIdToName =
            new Map()

          let jessmanChannelsFound =
            0

          let iptvOrgChannelsFound =
            0

          let jessmanProgrammesScanned =
            0

          let iptvOrgProgrammesScanned =
            0

          let jessmanProgrammesKept =
            0

          let iptvOrgProgrammesKept =
            0

          let jessmanProgrammesSkipped =
            0

          let iptvOrgProgrammesSkipped =
            0

          let jessmanDescriptionsChanged =
            0

          let iptvOrgDescriptionsChanged =
            0

          let jessmanActorsRemoved =
            0

          let iptvOrgActorsRemoved =
            0

          let jessmanCreditsRemoved =
            0

          let iptvOrgCreditsRemoved =
            0

          let jessmanEpisodeNumbersConverted =
            0

          let iptvOrgEpisodeNumbersConverted =
            0

          let jessmanOriginalAirDatesUsed =
            0

          let iptvOrgOriginalAirDatesUsed =
            0

          let jessmanIptvMatches =
            0

          let iptvOnlyProgrammes =
            0

          let jessmanOnlyProgrammes =
            0

          let iptvFieldsUsed =
            0

          let tvmazeMatches =
            0

          let tvmazeFieldsUsed =
            0

          let tmdbMatches =
            0

          let tmdbFieldsUsed =
            0

          let combinedProgrammes =
            0

          function decodeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&amp;/g,
                '&'
              )
              .replace(
                /&quot;/g,
                '"'
              )
              .replace(
                /&apos;/g,
                "'"
              )
              .replace(
                /&lt;/g,
                '<'
              )
              .replace(
                /&gt;/g,
                '>'
              )
          }

          function escapeXml(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /&/g,
                '&amp;'
              )
              .replace(
                /</g,
                '&lt;'
              )
              .replace(
                />/g,
                '&gt;'
              )
              .replace(
                /"/g,
                '&quot;'
              )
              .replace(
                /'/g,
                '&apos;'
              )
          }

          function cleanSpaces(
            value
          ) {
            return String(
              value ||
              ''
            )
              .replace(
                /\s+/g,
                ' '
              )
              .trim()
          }

          function cleanProgrammeTitle(
            value
          ) {
            return cleanSpaces(
              value
            )
              .replace(
                /\s+\(\d{4}\)\s*$/,
                ''
              )
              .replace(
                /\s*[.\-–—:]?\s*S(?:eason)?\s*\d{1,3}\s*E(?:pisode)?\s*\d{1,3}\s*$/i,
                ''
              )
              .trim()
          }

          function removeEmbeddedCredits(
            value
          ) {
            let result =
              cleanSpaces(
                value
              )

            const protectedDates =
              []

            result =
              result.replace(
                /\(\d{2}\/\d{2}\/\d{4}\)/g,
                match => {
                  const token =
                    '__AIRDATE_' +
                    protectedDates.length +
                    '__'

                  protectedDates.push(
                    match
                  )

                  return token
                }
              )

            result =
              result.replace(
                /\([^()]*\)/g,
                ''
              )

            result =
              result.replace(
                /\s+[A-Z][A-Za-z.'-]*(?:\s*,\s*[A-Z][A-Za-z.'-]*)*(?:\s+(?:and|&)\s+[A-Z][A-Za-z.'-]*)\s+(?:star|stars|starring)\.?\s*$/i,
                ''
              )

            result =
              result.replace(
                /\s+(?:with|featuring|featuring performances by|with performances by)\s+[^.!?]*[.!?]?\s*$/i,
                ''
              )

            result =
              result.replace(
                /\s+\*+\s*$/g,
                ''
              )

            result =
              result.replace(
                /\s+\.\s*$/g,
                ''
              )

            result =
              result.replace(
                /\s{2,}/g,
                ' '
              )
                .trim()

            result =
              result.replace(
                /__AIRDATE_(\d+)__/g,
                (
                  match,
                  index
                ) =>
                  protectedDates[
                    Number(
                      index
                    )
                  ] ||
                  ''
              )

            return cleanSpaces(
              result
            )
          }

          function normalizeChannelName(
            value
          ) {
            return cleanSpaces(
              value
            )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function normalizeTitle(
            value
          ) {
            return cleanSpaces(
              value
            )
              .replace(
                /\s+\(\d{4}\)\s*$/,
                ''
              )
              .toLowerCase()
              .replace(
                /[^a-z0-9]+/g,
                ''
              )
          }

          function getAttribute(
            block,
            attribute
          ) {
            const regex =
              new RegExp(
                '\\b' +
                attribute +
                '="([^"]*)"',
                'i'
              )

            const match =
              block.match(
                regex
              )

            return match
              ? decodeXml(
                  match[1]
                )
              : ''
          }

          function getTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          function getAllTags(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'gi'
              )

            return [
              ...block.matchAll(
                regex
              )
            ].map(
              match =>
                cleanSpaces(
                  decodeXml(
                    match[1]
                      .replace(
                        /<[^>]+>/g,
                        ''
                      )
                  )
                )
            )
          }

          function getTagBySystem(
            block,
            tag,
            system
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b' +
                '[^>]*\\bsystem="' +
                system +
                '"' +
                '[^>]*>' +
                '([\\s\\S]*?)' +
                '</' +
                tag +
                '>',
                'i'
              )

            const match =
              block.match(
                regex
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              decodeXml(
                match[1]
                  .replace(
                    /<[^>]+>/g,
                    ''
                  )
              )
            )
          }

          function parseXmltvDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/
              )

            if (
              !match
            ) {
              return null
            }

            return new Date(
              Date.UTC(
                Number(
                  match[1]
                ),
                Number(
                  match[2]
                ) -
                1,
                Number(
                  match[3]
                ),
                Number(
                  match[4]
                ),
                Number(
                  match[5]
                ),
                Number(
                  match[6]
                )
              )
            )
          }

          function parseOriginalAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})-(\d{2})-(\d{2})/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function parseCompactAirDate(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^(\d{4})(\d{2})(\d{2})$/
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              match[2] +
              '/' +
              match[3] +
              '/' +
              match[1]
            )
          }

          function normalizeEpisode(
            value
          ) {
            const match =
              String(
                value ||
                ''
              ).match(
                /^S\s*(\d{1,3})\s*E\s*(\d{1,3})$/i
              )

            if (
              !match
            ) {
              return ''
            }

            return (
              'S' +
              Number(
                match[1]
              ) +
              'E' +
              Number(
                match[2]
              )
            )
          }

          function extractEpisodeNumber(
            block
          ) {
            let episodeNumber =
              getTagBySystem(
                block,
                'episode-num',
                'common'
              )

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTagBySystem(
                  block,
                  'episode-num',
                  'onscreen'
                )
            }

            if (
              !episodeNumber
            ) {
              episodeNumber =
                getTag(
                  block,
                  'episode-num'
                )
            }

            return normalizeEpisode(
              episodeNumber
            )
          }

          function extractEpisodeTitle(
            block
          ) {
            const subtitle =
              cleanSpaces(
                getTag(
                  block,
                  'sub-title'
                )
              )

            if (
              subtitle
            ) {
              return subtitle
            }

            const description =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const match =
              description.match(
                /^S\s*\d{1,3}\s*E\s*\d{1,3}\s*[—-]\s*(.+?)(?:\n|$)/i
              )

            if (
              !match
            ) {
              return ''
            }

            return cleanSpaces(
              match[1]
            )
          }

          function extractAirDate(
            block
          ) {
            const structured =
              getTagBySystem(
                block,
                'episode-num',
                'original-air-date'
              )

            const fromStructured =
              parseOriginalAirDate(
                structured
              )

            if (
              fromStructured
            ) {
              return fromStructured
            }

            return parseCompactAirDate(
              getTag(
                block,
                'date'
              )
            )
          }

          function buildDescription(
            episodeTitle,
            episodeNumber,
            description,
            airDate
          ) {
            let result =
              ''

            if (
              episodeTitle &&
              episodeNumber
            ) {
              result =
                episodeTitle +
                ' - ' +
                episodeNumber
            } else if (
              episodeTitle
            ) {
              result =
                episodeTitle
            } else if (
              episodeNumber
            ) {
              result =
                episodeNumber
            }

            if (
              description
            ) {
              result =
                result
                  ? result +
                    '. ' +
                    description
                  :
                    description
            }

            if (
              airDate
            ) {
              result =
                result
                  ? result +
                    ' (' +
                    airDate +
                    ')'
                  :
                    '(' +
                    airDate +
                    ')'
            }

            return cleanSpaces(
              result
            )
          }

          function replaceTag(
            block,
            tag,
            value
          ) {
            const regex =
              new RegExp(
                '<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'i'
              )

            const replacement =
              '<' +
              tag +
              ' lang="en">' +
              escapeXml(
                value
              ) +
              '</' +
              tag +
              '>'

            if (
              regex.test(
                block
              )
            ) {
              return block.replace(
                regex,
                replacement
              )
            }

            return block.replace(
              /<\/programme>\s*$/i,
              '  ' +
              replacement +
              '\n</programme>'
            )
          }

          function removeTag(
            block,
            tag
          ) {
            const regex =
              new RegExp(
                '\\s*<' +
                tag +
                '\\b[^>]*>[\\s\\S]*?</' +
                tag +
                '>',
                'gi'
              )

            return block.replace(
              regex,
              ''
            )
          }


          function removeEpisodeNumBySystem(
            block,
            system
          ) {
            const regex =
              new RegExp(
                '\\s*<episode-num\\b' +
                '[^>]*\\bsystem="' +
                system +
                '"[^>]*>[\\s\\S]*?</episode-num>',
                'gi'
              )

            return block.replace(
              regex,
              ''
            )
          }

          function cleanProgrammeBlock(
            block,
            source
          ) {
            const originalDescription =
              cleanSpaces(
                getTag(
                  block,
                  'desc'
                )
              )

            const episodeTitle =
              extractEpisodeTitle(
                block
              )

            const episodeNumber =
              extractEpisodeNumber(
                block
              )

            const airDate =
              extractAirDate(
                block
              )

            const cleanedOriginalDescription =
              removeEmbeddedCredits(
                originalDescription
              )

            const description =
              buildDescription(
                episodeTitle,
                episodeNumber,
                cleanedOriginalDescription,
                airDate
              )

            if (
              description !==
              originalDescription
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanDescriptionsChanged++
              } else {
                iptvOrgDescriptionsChanged++
              }
            }

            if (
              /<actor\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanActorsRemoved++
              } else {
                iptvOrgActorsRemoved++
              }
            }

            if (
              /<credits\b/i.test(
                block
              )
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanCreditsRemoved++
              } else {
                iptvOrgCreditsRemoved++
              }
            }

            if (
              episodeNumber
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanEpisodeNumbersConverted++
              } else {
                iptvOrgEpisodeNumbersConverted++
              }
            }

            if (
              airDate
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanOriginalAirDatesUsed++
              } else {
                iptvOrgOriginalAirDatesUsed++
              }
            }

            const cleanedTitle =
              cleanProgrammeTitle(
                getTag(
                  block,
                  'title'
                )
              )

            let output =
              block

            output =
              replaceTag(
                output,
                'title',
                cleanedTitle
              )

            output =
              replaceTag(
                output,
                'desc',
                description
              )

            output =
              removeTag(
                output,
                'sub-title'
              )

            output =
              removeEpisodeNumBySystem(
                output,
                'onscreen'
              )

            output =
              removeEpisodeNumBySystem(
                output,
                'common'
              )

            output =
              removeEpisodeNumBySystem(
                output,
                'xmltv_ns'
              )

            output =
              removeTag(
                output,
                'actor'
              )

            output =
              removeTag(
                output,
                'credits'
              )

            return {
              block:
                output,

              title:
                cleanedTitle,

              episodeTitle,

              episodeNumber,

              airDate,

              description,

              icon:
                getAttribute(
                  block.match(
                    /<icon\b[^>]*>/i
                  )?.[0] ||
                  '',
                  'src'
                )
            }
          }

          function processProgramme(
            block,
            source,
            canonicalChannel
          ) {
            if (
              source ===
              'jessman'
            ) {
              jessmanProgrammesScanned++
            } else {
              iptvOrgProgrammesScanned++
            }

            const start =
              getAttribute(
                block,
                'start'
              )

            const startDate =
              parseXmltvDate(
                start
              )

            if (
              !startDate ||
              startDate < pastCutoff ||
              startDate >= cutoff
            ) {
              if (
                source ===
                'jessman'
              ) {
                jessmanProgrammesSkipped++
              } else {
                iptvOrgProgrammesSkipped++
              }

              return null
            }

            if (
              source ===
              'jessman'
            ) {
              jessmanProgrammesKept++
            } else {
              iptvOrgProgrammesKept++
            }

            const cleaned =
              cleanProgrammeBlock(
                block,
                source
              )

            const channel =
              getAttribute(
                block,
                'channel'
              )

            const key =
              [
                canonicalChannel,
                start,
                normalizeTitle(
                  cleaned.title
                )
              ].join(
                '|'
              )

            return {
              source,

              channel,

              canonicalChannel,

              start,

              stop:
                getAttribute(
                  block,
                  'stop'
                ),

              title:
                cleaned.title,

              episodeTitle:
                cleaned.episodeTitle,

              episodeNumber:
                cleaned.episodeNumber,

              airDate:
                cleaned.airDate,

              description:
                cleaned.description,

              icon:
                cleaned.icon,

              block:
                cleaned.block,

              key
            }
          }

          function parseXmlStream(
            stream,
            callback
          ) {
            return new Promise(
              (
                resolve,
                reject
              ) => {
                const rl =
                  readline.createInterface(
                    {
                      input:
                        stream,

                      crlfDelay:
                        Infinity
                    }
                  )

                let insideChannel =
                  false

                let channelBuffer =
                  ''

                let insideProgramme =
                  false

                let programmeBuffer =
                  ''

                ;(async () => {
                  try {
                    for await (
                      const line of rl
                    ) {
                      if (
                        !insideChannel &&
                        !insideProgramme &&
                        line.includes(
                          '<channel '
                        )
                      ) {
                        insideChannel =
                          true

                        channelBuffer =
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</channel>'
                          )
                        ) {
                          insideChannel =
                            false

                          await callback(
                            'channel',
                            channelBuffer
                          )

                          channelBuffer =
                            ''
                        }

                        continue
                      }

                      if (
                        insideChannel
                      ) {
                        channelBuffer +=
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</channel>'
                          )
                        ) {
                          insideChannel =
                            false

                          await callback(
                            'channel',
                            channelBuffer
                          )

                          channelBuffer =
                            ''
                        }

                        continue
                      }

                      if (
                        line.includes(
                          '<programme '
                        )
                      ) {
                        insideProgramme =
                          true

                        programmeBuffer =
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</programme>'
                          )
                        ) {
                          insideProgramme =
                            false

                          await callback(
                            'programme',
                            programmeBuffer
                          )

                          programmeBuffer =
                            ''
                        }

                        continue
                      }

                      if (
                        insideProgramme
                      ) {
                        programmeBuffer +=
                          line +
                          '\n'

                        if (
                          line.includes(
                            '</programme>'
                          )
                        ) {
                          insideProgramme =
                            false

                          await callback(
                            'programme',
                            programmeBuffer
                          )

                          programmeBuffer =
                            ''
                        }
                      }
                    }

                    resolve()
                  } catch (
                    error
                  ) {
                    reject(
                      error
                    )
                  }
                })()
              }
            )
          }

          async function loadJessman() {
            await parseXmlStream(
              fs.createReadStream(
                jessmanPath
              ),

              async (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  const displayNames =
                    getAllTags(
                      block,
                      'display-name'
                    )

                  const normalizedNames =
                    displayNames.map(
                      normalizeChannelName
                    )

                  let matchedName =
                    ''

                  for (
                    const targetName of
                    Object.keys(
                      jessmanChannels
                    )
                  ) {
                    if (
                      normalizedNames.includes(
                        normalizeChannelName(
                          targetName
                        )
                      )
                    ) {
                      matchedName =
                        targetName

                      break
                    }
                  }

                  if (
                    !matchedName
                  ) {
                    return
                  }

                  jessmanChannelsFound++

                  jessmanIdToName.set(
                    id,
                    matchedName
                  )

                  channelHeaders.set(
                    'jessman:' +
                    matchedName,
                    {
                      source:
                        'jessman',

                      id,

                      canonicalChannel:
                        matchedName,

                      displayName:
                        jessmanChannels[
                          matchedName
                        ].displayName,

                      block
                    }
                  )

                  console.log(
                    'Jessman channel matched: ' +
                    matchedName +
                    ' -> ' +
                    id
                  )

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                const canonicalChannel =
                  jessmanIdToName.get(
                    channel
                  )

                if (
                  !canonicalChannel
                ) {
                  return
                }

                const programme =
                  processProgramme(
                    block,
                    'jessman',
                    canonicalChannel
                  )

                if (
                  !programme
                ) {
                  return
                }

                if (
                  !jessman.has(
                    canonicalChannel
                  )
                ) {
                  jessman.set(
                    canonicalChannel,
                    new Map()
                  )
                }

                jessman.get(
                  canonicalChannel
                ).set(
                  programme.key,
                  programme
                )
              }
            )
          }

          async function loadIptvOrg() {
            const input =
              fs.createReadStream(
                iptvOrgPath
              )

            const gunzip =
              zlib.createGunzip()

            input.pipe(
              gunzip
            )

            await parseXmlStream(
              gunzip,

              async (
                type,
                block
              ) => {
                if (
                  type ===
                  'channel'
                ) {
                  const id =
                    getAttribute(
                      block,
                      'id'
                    )

                  if (
                    !iptvOrgChannels[id]
                  ) {
                    return
                  }

                  iptvOrgChannelsFound++

                  const channel =
                    iptvOrgChannels[id]

                  channelHeaders.set(
                    'iptv:' +
                    id,
                    {
                      source:
                        'iptvorg',

                      id,

                      canonicalChannel:
                        channel.displayName,

                      displayName:
                        channel.displayName,

                      block
                    }
                  )

                  return
                }

                const channel =
                  getAttribute(
                    block,
                    'channel'
                  )

                if (
                  !iptvOrgChannels[channel]
                ) {
                  return
                }

                const canonicalChannel =
                  iptvOrgChannels[
                    channel
                  ].displayName

                const programme =
                  processProgramme(
                    block,
                    'iptvorg',
                    canonicalChannel
                  )

                if (
                  !programme
                ) {
                  return
                }

                if (
                  !iptvOrg.has(
                    canonicalChannel
                  )
                ) {
                  iptvOrg.set(
                    canonicalChannel,
                    new Map()
                  )
                }

                iptvOrg.get(
                  canonicalChannel
                ).set(
                  programme.key,
                  programme
                )
              }
            )
          }

          function fillMissingField(
            target,
            field,
            value,
            source
          ) {
            if (
              target[field]
            ) {
              return false
            }

            if (
              !value
            ) {
              return false
            }

            target[field] =
              value

            if (
              source ===
              'iptvorg'
            ) {
              iptvFieldsUsed++
            }

            if (
              source ===
              'tvmaze'
            ) {
              tvmazeFieldsUsed++
            }

            if (
              source ===
              'tmdb'
            ) {
              tmdbFieldsUsed++
            }

            return true
          }

          function mergeMissingFields(
            target,
            source,
            sourceName
          ) {
            fillMissingField(
              target,
              'episodeTitle',
              source.episodeTitle,
              sourceName
            )

            fillMissingField(
              target,
              'episodeNumber',
              source.episodeNumber,
              sourceName
            )

            fillMissingField(
              target,
              'description',
              source.description,
              sourceName
            )

            fillMissingField(
              target,
              'airDate',
              source.airDate,
              sourceName
            )

            fillMissingField(
              target,
              'icon',
              source.icon,
              sourceName
            )
          }

          const tvmazeCache =
            new Map()

          const tmdbCache =
            new Map()

          function sleep(
            milliseconds
          ) {
            return new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  milliseconds
                )
            )
          }

          async function fetchJson(
            url,
            headers = {}
          ) {
            try {
              const response =
                await fetch(
                  url,
                  {
                    headers
                  }
                )

              if (
                !response.ok
              ) {
                return null
              }

              return await response.json()
            } catch (
              error
            ) {
              return null
            }
          }

          async function getTvmazeShow(
            title
          ) {
            const key =
              normalizeTitle(
                title
              )

            if (
              tvmazeCache.has(
                key
              )
            ) {
              return tvmazeCache.get(
                key
              )
            }

            const data =
              await fetchJson(
                'https://api.tvmaze.com/search/shows?q=' +
                encodeURIComponent(
                  title
                )
              )

            await sleep(
              250
            )

            const result =
              data &&
              data.length
                ? data[0].show
                : null

            tvmazeCache.set(
              key,
              result
            )

            return result
          }

          async function enrichFromTvmaze(
            programme
          ) {
            if (
              !programme.episodeNumber
            ) {
              return
            }

            const match =
              programme.episodeNumber.match(
                /^S(\d+)E(\d+)$/i
              )

            if (
              !match
            ) {
              return
            }

            const show =
              await getTvmazeShow(
                programme.title
              )

            if (
              !show
            ) {
              return
            }

            const episodeData =
              await fetchJson(
                'https://api.tvmaze.com/shows/' +
                show.id +
                '/episodebynumber?season=' +
                Number(
                  match[1]
                ) +
                '&number=' +
                Number(
                  match[2]
                )
              )

            await sleep(
              250
            )

            if (
              !episodeData
            ) {
              return
            }

            let used =
              false

            used =
              fillMissingField(
                programme,
                'episodeTitle',
                cleanSpaces(
                  episodeData.name
                ),
                'tvmaze'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'description',
                cleanSpaces(
                  episodeData.summary
                    ? episodeData.summary
                      .replace(
                        /<[^>]+>/g,
                        ''
                      )
                    : ''
                ),
                'tvmaze'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'airDate',
                episodeData.airdate
                  ? episodeData.airdate
                    .split(
                      '-'
                    )
                    .reverse()
                    .join(
                      '/'
                    )
                  : '',
                'tvmaze'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'icon',
                episodeData.image
                  ? (
                    episodeData.image.original ||
                    episodeData.image.medium
                  )
                  : '',
                'tvmaze'
              ) ||
              used

            if (
              used
            ) {
              tvmazeMatches++
            }
          }

          async function enrichFromTmdb(
            programme
          ) {
            if (
              !process.env.TMDB_API_TOKEN
            ) {
              return
            }

            if (
              !programme.episodeNumber
            ) {
              return
            }

            const match =
              programme.episodeNumber.match(
                /^S(\d+)E(\d+)$/i
              )

            if (
              !match
            ) {
              return
            }

            const cacheKey =
              normalizeTitle(
                programme.title
              )

            let show =
              tmdbCache.get(
                cacheKey
              )

            if (
              !show
            ) {
              const searchData =
                await fetchJson(
                  'https://api.themoviedb.org/3/search/tv?query=' +
                  encodeURIComponent(
                    programme.title
                  ),
                  {
                    Authorization:
                      'Bearer ' +
                      process.env.TMDB_API_TOKEN,

                    accept:
                      'application/json'
                  }
                )

              show =
                searchData &&
                searchData.results &&
                searchData.results.length
                  ? searchData.results[0]
                  : null

              tmdbCache.set(
                cacheKey,
                show
              )

              await sleep(
                250
              )
            }

            if (
              !show
            ) {
              return
            }

            const episodeData =
              await fetchJson(
                'https://api.themoviedb.org/3/tv/' +
                show.id +
                '/season/' +
                Number(
                  match[1]
                ) +
                '/episode/' +
                Number(
                  match[2]
                ),
                {
                  Authorization:
                    'Bearer ' +
                    process.env.TMDB_API_TOKEN,

                  accept:
                    'application/json'
                }
              )

            await sleep(
              250
            )

            if (
              !episodeData
            ) {
              return
            }

            let used =
              false

            used =
              fillMissingField(
                programme,
                'episodeTitle',
                cleanSpaces(
                  episodeData.name
                ),
                'tmdb'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'description',
                cleanSpaces(
                  episodeData.overview
                ),
                'tmdb'
              ) ||
              used

            used =
              fillMissingField(
                programme,
                'airDate',
                episodeData.air_date
                  ? episodeData.air_date
                    .split(
                      '-'
                    )
                    .reverse()
                    .join(
                      '/'
                    )
                  : '',
                'tmdb'
              ) ||
              used

            if (
              used
            ) {
              tmdbMatches++
            }
          }

          async function buildFinalProgrammes() {
            const finalProgrammes =
              new Map()

            for (
              const programmes of
              jessman.values()
            ) {
              for (
                const programme of
                programmes.values()
              ) {
                finalProgrammes.set(
                  programme.key,
                  {
                    ...programme
                  }
                )
              }
            }

            for (
              const programmes of
              iptvOrg.values()
            ) {
              for (
                const programme of
                programmes.values()
              ) {
                const existing =
                  finalProgrammes.get(
                    programme.key
                  )

                if (
                  existing
                ) {
                  jessmanIptvMatches++

                  mergeMissingFields(
                    existing,
                    programme,
                    'iptvorg'
                  )

                  continue
                }

                finalProgrammes.set(
                  programme.key,
                  {
                    ...programme
                  }
                )

                iptvOnlyProgrammes++
              }
            }

            for (
              const programme of
              finalProgrammes.values()
            ) {
              if (
                programme.source ===
                'jessman'
              ) {
                jessmanOnlyProgrammes++
              }
            }

            for (
              const programme of
              finalProgrammes.values()
            ) {
              await enrichFromTvmaze(
                programme
              )
            }

            for (
              const programme of
              finalProgrammes.values()
            ) {
              await enrichFromTmdb(
                programme
              )
            }

            return finalProgrammes
          }

          function buildChannel(
            channelHeader
          ) {
            let block =
              channelHeader.block

            const originalId =
              getAttribute(
                block,
                'id'
              )

            if (
              originalId !==
              channelHeader.id
            ) {
              block =
                block.replace(
                  /(<channel\b[^>]*\bid=")[^"]*(")/i,
                  '$1' +
                  escapeXml(
                    channelHeader.id
                  ) +
                  '$2'
                )
            }

            const displayName =
              channelHeader.displayName

            if (
              getAllTags(
                block,
                'display-name'
              ).length
            ) {
              block =
                block.replace(
                  /(<display-name\b[^>]*>)[\s\S]*?(<\/display-name>)/i,
                  '$1' +
                  escapeXml(
                    displayName
                  ) +
                  '$2'
                )
            }

            return block.trimEnd() +
              '\n'
          }

          function buildProgramme(
            programme
          ) {
            let block =
              programme.block

            const channel =
              programme.channel

            block =
              block.replace(
                /(\bchannel=")[^"]*(")/i,
                '$1' +
                escapeXml(
                  channel
                ) +
                '$2'
              )

            block =
              replaceTag(
                block,
                'title',
                programme.title
              )

            return block.trimEnd() +
              '\n'
          }

          async function main() {
            await loadJessman()

            await loadIptvOrg()

            const finalProgrammes =
              await buildFinalProgrammes()

            const output =
              fs.createWriteStream(
                outputPath,
                {
                  encoding:
                    'utf8'
                }
              )

            await new Promise(
              (
                resolve,
                reject
              ) => {
                output.once(
                  'error',
                  reject
                )

                output.write(
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                )

                output.write(
                  '<tv generator-info-name="Combined FAST">\n'
                )

                for (
                  const channelHeader of
                  channelHeaders.values()
                ) {
                  output.write(
                    buildChannel(
                      channelHeader
                    )
                  )
                }

                const ordered =
                  Array.from(
                    finalProgrammes.values()
                  ).sort(
                    (
                      a,
                      b
                    ) =>
                      a.start.localeCompare(
                        b.start
                      )
                  )

                for (
                  const programme of
                  ordered
                ) {
                  output.write(
                    buildProgramme(
                      programme
                    )
                  )

                  combinedProgrammes++
                }

                output.write(
                  '</tv>\n'
                )

                output.end(
                  resolve
                )
              }
            )

            const totalProgrammesScanned =
              jessmanProgrammesScanned +
              iptvOrgProgrammesScanned

            const totalProgrammesKept =
              jessmanProgrammesKept +
              iptvOrgProgrammesKept

            const totalProgrammesSkipped =
              jessmanProgrammesSkipped +
              iptvOrgProgrammesSkipped

            const totalDescriptionsChanged =
              jessmanDescriptionsChanged +
              iptvOrgDescriptionsChanged

            const totalActorsRemoved =
              jessmanActorsRemoved +
              iptvOrgActorsRemoved

            const totalCreditsRemoved =
              jessmanCreditsRemoved +
              iptvOrgCreditsRemoved

            const totalEpisodeNumbersConverted =
              jessmanEpisodeNumbersConverted +
              iptvOrgEpisodeNumbersConverted

            const totalOriginalAirDatesUsed =
              jessmanOriginalAirDatesUsed +
              iptvOrgOriginalAirDatesUsed

            console.log('')
            console.log('========================================')
            console.log('COMBINED FAST PROCESSING COMPLETE')
            console.log('========================================')
            console.log('')

            console.log('CHANNELS')
            console.log(
              'Jessman channels found: ' +
              jessmanChannelsFound
            )
            console.log(
              'IPTV-org channels found: ' +
              iptvOrgChannelsFound
            )
            console.log(
              'Total channels written: ' +
              channelHeaders.size
            )

            console.log('')
            console.log('JESSMAN PROGRAMMES')
            console.log(
              'Programmes scanned: ' +
              jessmanProgrammesScanned
            )
            console.log(
              'Programmes kept: ' +
              jessmanProgrammesKept
            )
            console.log(
              'Programmes skipped: ' +
              jessmanProgrammesSkipped
            )
            console.log(
              'Descriptions changed: ' +
              jessmanDescriptionsChanged
            )
            console.log(
              'Actors removed: ' +
              jessmanActorsRemoved
            )
            console.log(
              'Credits removed: ' +
              jessmanCreditsRemoved
            )
            console.log(
              'Episode numbers converted: ' +
              jessmanEpisodeNumbersConverted
            )
            console.log(
              'Original air dates used: ' +
              jessmanOriginalAirDatesUsed
            )

            console.log('')
            console.log('IPTV-ORG PROGRAMMES')
            console.log(
              'Programmes scanned: ' +
              iptvOrgProgrammesScanned
            )
            console.log(
              'Programmes kept: ' +
              iptvOrgProgrammesKept
            )
            console.log(
              'Programmes skipped: ' +
              iptvOrgProgrammesSkipped
            )
            console.log(
              'Descriptions changed: ' +
              iptvOrgDescriptionsChanged
            )
            console.log(
              'Actors removed: ' +
              iptvOrgActorsRemoved
            )
            console.log(
              'Credits removed: ' +
              iptvOrgCreditsRemoved
            )
            console.log(
              'Episode numbers converted: ' +
              iptvOrgEpisodeNumbersConverted
            )
            console.log(
              'Original air dates used: ' +
              iptvOrgOriginalAirDatesUsed
            )

            console.log('')
            console.log('ENRICHMENT PIPELINE')
            console.log(
              'Jessman + IPTV-org unique matches: ' +
              jessmanIptvMatches
            )
            console.log(
              'Jessman-only programmes: ' +
              jessmanOnlyProgrammes
            )
            console.log(
              'IPTV-org-only programmes: ' +
              iptvOnlyProgrammes
            )
            console.log(
              'IPTV-org fields used to fill missing data: ' +
              iptvFieldsUsed
            )
            console.log(
              'TVMaze matched programmes: ' +
              tvmazeMatches
            )
            console.log(
              'TVMaze fields used to fill missing data: ' +
              tvmazeFieldsUsed
            )
            console.log(
              'TMDB matched programmes: ' +
              tmdbMatches
            )
            console.log(
              'TMDB fields used to fill missing data: ' +
              tmdbFieldsUsed
            )

            console.log('')
            console.log('COMBINED TOTALS')
            console.log(
              'Programmes scanned: ' +
              totalProgrammesScanned
            )
            console.log(
              'Programmes kept: ' +
              totalProgrammesKept
            )
            console.log(
              'Programmes skipped: ' +
              totalProgrammesSkipped
            )
            console.log(
              'Descriptions changed: ' +
              totalDescriptionsChanged
            )
            console.log(
