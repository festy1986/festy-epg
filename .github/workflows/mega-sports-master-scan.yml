name: MEGA Sports Master Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

concurrency:
  group: mega-sports-master-scan
  cancel-in-progress: false

jobs:
  scan-mega-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Run MEGA sports scanner
        env:
          MEGA_XTREAM_URL: ${{ secrets.MEGA_XTREAM_URL }}
          MEGA_XTREAM_USERNAME: ${{ secrets.MEGA_XTREAM_USERNAME }}
          MEGA_XTREAM_PASSWORD: ${{ secrets.MEGA_XTREAM_PASSWORD }}
        run: python config/mega_sports_master_scan.py

      - name: Commit updated MEGA master lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/mega_sports_master.txt \
                  config/mega_sports_master.csv \
                  config/mega_sports_master.json

          if git diff --cached --quiet; then
            echo "MEGA master lists have not changed."
          else
            git commit -m "Update MEGA sports master lists"
            git push
          fi
