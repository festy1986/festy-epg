```yaml
name: Plex Channel Discovery Test 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect Plex provider features
        shell: bash
        run: |
          cat > plex_discovery_test_2.py <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          BASE = "https://epg.provider.plex.tv"
          MGM_KEY = "6abd4e58a9d133322be5f940"
          TODAY = datetime.now(timezone.utc).date().isoformat()

          HEADERS = {
              "Accept": "application/json",
              "User-Agent": "Plex-Channel-Discovery-Test/2.0",
              "X-Plex-Product": "Plex Channel Discovery Test",
              "X-Plex-Client-Identifier": "plex-channel-discovery-test",
          }

          def fetch(path):
              url = BASE + path
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      raw = response.read()
                      try:
                          body = json.loads(raw.decode("utf-8"))
                      except Exception:
                          body = {"raw_preview": raw[:2000].decode(
                              "utf-8", errors="replace")}
                      return {
                          "url": url,
                          "status": response.status,
                          "content_type": response.headers.get(
                              "Content-Type", ""),
                          "bytes": len(raw),
                          "body": body,
                      }
              except urllib.error.HTTPError as exc:
                  raw = exc.read(3000).decode("utf-8", errors="replace")
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {"raw_preview": raw}
                  return {
                      "url": url,
                      "status": exc.code,
                      "error": str(exc.reason),
                      "body": body,
                  }
              except Exception as exc:
                  return {
                      "url": url,
                      "error": f"{type(exc).__name__}: {exc}",
                  }

          def find_channel_like_fields(obj, path="$", found=None):
              if found is None:
                  found = []
              if isinstance(obj, dict):
                  interesting = {
                      "title", "name", "channel", "channelid",
                      "channelgridkey", "gridkey", "logo", "clearlogo",
                      "image", "images", "key", "id"
                  }
                  matching = {
                      str(k).lower(): v for k, v in obj.items()
                      if str(k).lower() in interesting
                  }
                  if matching:
                      found.append({"path": path, "fields": matching})
                  for k, v in obj.items():
                      find_channel_like_fields(
                          v, f"{path}.{k}", found)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj[:500]):
                      find_channel_like_fields(v, f"{path}[{i}]", found)
              return found

          report = {
              "tested_at_utc": datetime.now(timezone.utc).isoformat(),
              "purpose": (
                  "Discover advertised Plex EPG features and identify "
                  "which responses expose channel catalogs, grid keys, "
                  "and logos. This is diagnostic only."
              ),
              "provider_root": None,
              "features": [],
              "endpoint_tests": [],
              "channel_like_fields": [],
          }

          root = fetch("/")
          report["provider_root"] = root
          provider = (
              root.get("body", {})
                  .get("MediaProvider", {})
              if isinstance(root.get("body"), dict) else {}
          )
          features = provider.get("Feature", [])
          if not isinstance(features, list):
              features = []

          report["provider_metadata"] = {
              key: value for key, value in provider.items()
              if key != "Feature"
          }
          report["features"] = features

          seen = set()
          paths = []

          for feature in features:
              if not isinstance(feature, dict):
                  continue
              key = feature.get("key")
              if isinstance(key, str) and key.startswith("/") and key not in seen:
                  seen.add(key)
                  paths.append(key)

          # Test each path exactly as advertised, without inventing
          # required query parameters or authentication tokens.
          for path in paths:
              result = fetch(path)
              result["advertised_feature_path"] = path
              report["endpoint_tests"].append(result)

          # Known-good reference: this tests schedule access only.
          grid_path = "/grid?" + urllib.parse.urlencode({
              "channelGridKey": MGM_KEY,
              "date": TODAY,
              "x-plex-provider-version": "7.0.0",
          })
          report["endpoint_tests"].append({
              "advertised_feature_path": "known MGM schedule reference",
              **fetch(grid_path),
          })

          # Search the root and every endpoint response for useful fields.
          objects = [("provider_root", root)]
          objects.extend(
              (entry.get("advertised_feature_path", "unknown"), entry)
              for entry in report["endpoint_tests"]
          )

          for label, obj in objects:
              body = obj.get("body")
              if body is not None:
                  fields = find_channel_like_fields(body)
                  if fields:
                      report["channel_like_fields"].append({
                          "source": label,
                          "matches": fields[:500],
                      })

          os.makedirs("plex-discovery-report-2", exist_ok=True)
          with open(
              "plex-discovery-report-2/report.json",
              "w", encoding="utf-8"
          ) as f:
              json.dump(report, f, indent=2, ensure_ascii=False)

          print("Provider:", json.dumps(report["provider_metadata"]))
          print("\nAdvertised feature definitions:")
          print(json.dumps(features, indent=2))
          print("\nEndpoint status summary:")
          for entry in report["endpoint_tests"]:
              print(json.dumps({
                  "path": entry.get("advertised_feature_path"),
                  "url": entry.get("url"),
                  "status": entry.get("status"),
                  "bytes": entry.get("bytes"),
                  "error": entry.get("error"),
              }))
          print("\nFull report saved.")
          PY

          python plex_discovery_test_2.py

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plex-channel-discovery-report-2
          path: plex-discovery-report-2/report.json
          if-no-files-found: warn
          retention-days: 7
```
