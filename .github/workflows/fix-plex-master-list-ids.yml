name: Fix Plex Master List Channel IDs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-channel-ids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Plex catalog and fix XML IDs
        env:
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import re
          import sys
          import html
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          target = "config/Plex Master List.xml"
          token = os.environ.get("PLEX_TOKEN", "").strip()

          if not token:
              sys.exit("ERROR: GitHub secret PLEX_TOKEN is missing.")

          url = (
              "https://epg.provider.plex.tv/lineups/plex/channels"
              "?X-Plex-Token=" + token
          )

          request = urllib.request.Request(
              url, headers={"Accept": "application/xml"}
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  catalog_xml = response.read()
          except Exception as error:
              sys.exit(f"ERROR: Could not fetch Plex catalog: {error}")

          try:
              root = ET.fromstring(catalog_xml)
          except ET.ParseError as error:
              sys.exit(f"ERROR: Plex catalog XML is invalid: {error}")

          channels = []

          for channel in root.iter("Channel"):
              channel_id = channel.get("id", "")
              slug = channel.get("slug", "")
              title = channel.get("title", "")
              grid_key = channel.get("gridKey", "")

              if channel_id and title:
                  channels.append({
                      "id": channel_id,
                      "slug": slug,
                      "title": title,
                      "gridKey": grid_key,
                  })

          if not channels:
              sys.exit("ERROR: Plex returned no usable channel records.")

