name: Fix Plex Master List Channel IDs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-channel-ids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Plex catalog and fix XML IDs
        env:
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import re
          import sys
          import html
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          target = "config/Plex Master List.xml"
          token = os.environ.get("PLEX_TOKEN", "").strip()

          if not token:
              sys.exit("ERROR: GitHub secret PLEX_TOKEN is missing.")

          url = (
              "https://epg.provider.plex.tv/lineups/plex/channels"
              "?X-Plex-Token=" + token
          )

          request = urllib.request.Request(
              url, headers={"Accept": "application/xml"}
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              catalog_xml = response.read()

          root = ET.fromstring(catalog_xml)
          channels = []

          for channel in root.iter("Channel"):
              channel_id = channel.get("id", "")
              slug = channel.get("slug", "")
              title = channel.get("title", "")
              grid_key = channel.get("gridKey", "")

              if channel_id and title:
                  channels.append({
                      "id": channel_id,
                      "slug": slug,
                      "title": title,
                      "gridKey": grid_key,
                  })

          if not channels:
              sys.exit("ERROR: Plex returned no usable channel records.")

          def normalize(value):
              value = html.unescape(value).casefold().strip()
              value = re.sub(r"\s*\[[^\]]*\]", "", value)
              return re.sub(r"[^a-z0-9]", "", value)

          by_id = {c["id"]: c for c in channels}
          by_slug = {c["slug"]: c for c in channels if c["slug"]}

          title_groups = defaultdict(list)
          for channel in channels:
              title_groups[normalize(channel["title"])].append(channel)

          # Only use a title match when it identifies exactly one channel.
          by_title = {
              name: matches[0]
              for name, matches in title_groups.items()
              if name and len(matches) == 1
          }

          with open(target, "r", encoding="utf-8") as file:
              original = file.read()

          updated_count = 0
          unchanged_count = 0
          unmatched = []

          def fix_channel(match):
              global updated_count, unchanged_count

              block = match.group(0)
              opening_end = block.find(">") + 1
              opening = block[:opening_end]
              body = block[opening_end:]

              id_match = re.search(
                  r'\bid\s*=\s*(["\'])(.*?)\1', opening
              )

              if not id_match:
                  return block

              old_id = html.unescape(id_match.group(2))

              display_match = re.search(
                  r"<display-name\b[^>]*>(.*?)</display-name\s*>",
                  body,
                  re.IGNORECASE | re.DOTALL,
              )

              display_name = (
                  html.unescape(
                      re.sub(r"<[^>]+>", "", display_match.group(1))
                  ).strip()
                  if display_match else ""
              )

              # Prefer exact catalog IDs, then slugs, then unique titles.
              channel = (
                  by_id.get(old_id)
                  or by_slug.get(old_id)
                  or by_title.get(normalize(display_name))
              )

              if not channel:
                  unmatched.append(
                      f"{display_name or '(unnamed)'} [{old_id}]"
                  )
                  return block

              new_id = channel["id"]

              if old_id == new_id:
                  unchanged_count += 1
                  return block

              # Replace only the ID value; preserve the rest of the tag.
              opening = (
                  opening[:id_match.start(2)]
                  + new_id
                  + opening[id_match.end(2):]
              )

              updated_count += 1
              print(
                  f"UPDATED: {display_name}: "
                  f"{old_id} -> {new_id}"
              )

              return opening + body

          # Match each channel block independently.
          pattern = re.compile(
              r"<channel\b[^>]*>.*?</channel\s*>",
              re.IGNORECASE | re.DOTALL,
          )

          updated = pattern.sub(fix_channel, original)

          # Do not write or commit anything if a channel cannot be matched.
          if unmatched:
              print("\nChannels requiring a closer match:")
              for item in unmatched:
                  print(" - " + item)

              sys.exit(
                  "ERROR: Unmatched channels remain. "
                  "No changes will be committed."
              )

          # Collapse whitespace between tags within each channel only.
          # This keeps each entire channel element on a single line.
          def one_line_channel(match):
              block = match.group(0)
              return re.sub(r">\s+<", "><", block).strip()

          updated = pattern.sub(one_line_channel, updated)

          # Validate the completed XML before writing it.
          try:
              ET.fromstring(updated)
          except ET.ParseError as error:
              sys.exit(f"ERROR: Resulting XML is invalid: {error}")

          with open(target, "w", encoding="utf-8", newline="") as file:
              file.write(updated)

          print()
          print(f"Plex catalog channels: {len(channels)}")
          print(f"IDs updated: {updated_count}")
          print(f"Already correct: {unchanged_count}")
          print("Unmatched XML channels: 0")
          print("XML validation passed.")
          print("Every channel element is on one line.")
          PY

      - name: Commit corrected master list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "config/Plex Master List.xml"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Plex master list channel IDs"
            git push
          fi
