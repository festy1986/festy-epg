name: TVMaze Search Stability Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvmaze-search-stability-test
  cancel-in-progress: false

jobs:
  test-search:
    name: Test repeated TVMaze searches
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sequential search tests
        shell: bash
        run: |
          node <<'EOF'
          const BASE = 'https://api.tvmaze.com/search/shows?q=';
          const TIMEOUT_MS = 15000;
          const PAUSE_MS = 3000;

          const queries = [
            'game of thrones',
            'the office',
            'law and order',
            'star trek',
            'murder she wrote',
            'ncis'
          ];

          async function testSearch(query, index) {
            const url = BASE + encodeURIComponent(query);
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
            const started = Date.now();

            console.log('');
            console.log(`=== Test ${index + 1}/${queries.length}: ${query} ===`);
            console.log(`GET ${url}`);

            try {
              const response = await fetch(url, {
                headers: {
                  Accept: 'application/json',
                  'User-Agent': 'festy-epg-tvmaze-search-stability-test/1.0'
                },
                signal: controller.signal
              });

              const elapsed = Date.now() - started;
              console.log(`HTTP status: ${response.status}`);
              console.log(`Elapsed: ${elapsed} ms`);
              console.log(
                `Content-Type: ${response.headers.get('content-type') || '(missing)'}`
              );

              for (const header of [
                'retry-after',
                'x-ratelimit-limit',
                'x-ratelimit-remaining',
                'x-ratelimit-reset'
              ]) {
                const value = response.headers.get(header);
                if (value !== null) console.log(`${header}: ${value}`);
              }

              const body = await response.text();

              if (!response.ok) {
                console.log(`Response body: ${body.slice(0, 400)}`);
                throw new Error(`HTTP ${response.status}`);
              }

              let data;
              try {
                data = JSON.parse(body);
              } catch (error) {
                console.log(`Response body: ${body.slice(0, 400)}`);
                throw new Error(`Invalid JSON: ${error.message}`);
              }

              if (!Array.isArray(data)) {
                throw new Error(
                  `Expected search results array, got ${typeof data}`
                );
              }

              if (
                data.length > 0 &&
                (!data[0].show ||
                 typeof data[0].show.id !== 'number' ||
                 typeof data[0].show.name !== 'string')
              ) {
                throw new Error(
                  'Unexpected response schema; expected result.show.id and result.show.name'
                );
              }

              console.log(`Search results: ${data.length}`);
              console.log('RESULT: PASS');
              return { query, passed: true, elapsed };
            } catch (error) {
              const elapsed = Date.now() - started;

              if (error.name === 'AbortError') {
                console.log(`RESULT: FAIL — timed out after ${TIMEOUT_MS} ms`);
              } else {
                console.log(
                  `RESULT: FAIL — ${error.stack || error.message || String(error)}`
                );
              }

              return {
                query,
                passed: false,
                elapsed,
                error: error.name === 'AbortError'
                  ? `timeout after ${TIMEOUT_MS} ms`
                  : (error.message || String(error))
              };
            } finally {
              clearTimeout(timer);
            }
          }

          async function main() {
            console.log(`Started: ${new Date().toISOString()}`);
            console.log(`Tests: ${queries.length}; timeout: ${TIMEOUT_MS} ms each`);
            console.log('Sequential requests with a 3-second pause; no automatic retries.');

            const results = [];

            for (let i = 0; i < queries.length; i++) {
              results.push(await testSearch(queries[i], i));

              if (i < queries.length - 1) {
                await new Promise(resolve => setTimeout(resolve, PAUSE_MS));
              }
            }

            console.log('');
            console.log('=== SUMMARY ===');
            for (const result of results) {
              console.log(
                `${result.passed ? 'PASS' : 'FAIL'} | ${result.query} | ${result.elapsed} ms` +
                (result.error ? ` | ${result.error}` : '')
              );
            }

            const passed = results.filter(result => result.passed).length;
            const failed = results.length - passed;
            console.log(`Passed: ${passed}/${results.length}`);
            console.log(`Failed: ${failed}/${results.length}`);
            console.log(`Finished: ${new Date().toISOString()}`);

            if (failed > 0) {
              console.log(
                'CONCLUSION: At least one search request failed. Compare failures and timings; this alone cannot distinguish TVMaze from a network-path issue.'
              );
              process.exitCode = 1;
            } else {
              console.log(
                'CONCLUSION: All sampled search requests succeeded. Intermittent failures remain possible.'
              );
            }
          }

          main().catch(error => {
            console.error('Test script error:', error.stack || error);
            process.exitCode = 1;
          });
          EOF
