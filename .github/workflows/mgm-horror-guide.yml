```yaml
name: MGM Presents Horror Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: mgm-horror-guide
  cancel-in-progress: false

jobs:
  build-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Plex schedule and build 14-day XMLTV guide
        run: |
          python3 - <<'PY'
          import gzip
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          # Plex channel identifier:
          # 6a1610bebdf296985fd95603-6abd4e58a9d133322be5f940
          #
          # The Plex grid endpoint uses the channelGridKey portion
          # after the hyphen.
          CHANNEL_GRID_KEY = "6abd4e58a9d133322be5f940"

          XMLTV_CHANNEL_ID = "mgm-presents-horror"
          CHANNEL_NAME = "MGM Presents: Horror"
          OUTPUT = Path("guides/mgm-horror.xml.gz")
          DAYS = 14

          BASE_URL = "https://epg.provider.plex.tv/grid"

          now = datetime.now(timezone.utc)
          window_end = now + timedelta(days=DAYS)

          programmes = {}

          def fetch_day(day):
              params = urllib.parse.urlencode({
                  "channelGridKey": CHANNEL_GRID_KEY,
                  "date": day.isoformat(),
                  "x-plex-provider-version": "7.0.0",
              })

              url = f"{BASE_URL}?{params}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/xml",
                      "X-Plex-Language": "en",
                      "User-Agent": "festy-epg/1.0",
                  },
              )

              last_error = None

              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(
                          request, timeout=60
                      ) as response:
                          body = response.read()

                      root = ET.fromstring(body)

                      if root.tag != "MediaContainer":
                          raise RuntimeError(
                              f"Unexpected XML root: {root.tag}"
                          )

                      return root

                  except Exception as exc:
                      last_error = exc
                      print(
                          f"Attempt {attempt + 1}/3 failed "
                          f"for {day}: {exc}"
                      )
                      time.sleep(2 * (attempt + 1))

              raise RuntimeError(
                  f"Could not fetch schedule for {day}: {last_error}"
              )

          def child_text(element, name):
              child = element.find(name)
              return (child.text or "").strip() if child is not None else ""

          def xmltv_time(timestamp):
              return datetime.fromtimestamp(
                  timestamp, timezone.utc
              ).strftime("%Y%m%d%H%M%S +0000")

          first_day = now.date()
          print(f"Building guide from {first_day} for {DAYS} days.")

          for offset in range(DAYS):
              day = first_day + timedelta(days=offset)
              print(f"Fetching Plex schedule for {day}...")

              root = fetch_day(day)
              videos = list(root.iter("Video"))
              found_today = 0

              print(
                  f"  Plex returned {len(videos)} programme records."
              )

              for video in videos:
                  title = video.get("title", "").strip()
                  if not title:
                      continue

                  summary = video.get("summary", "").strip()
                  kind = video.get("type", "").strip().lower()
                  series = video.get("grandparentTitle", "").strip()
                  season = video.get("parentIndex", "").strip()
                  episode = video.get("index", "").strip()
                  year = video.get("year", "").strip()
                  rating = video.get("contentRating", "").strip()

                  for media in video.findall("Media"):
                      begins = media.get("beginsAt")
                      ends = media.get("endsAt")

                      if not begins or not ends:
                          continue

                      try:
                          start = int(begins)
                          stop = int(ends)
                      except (TypeError, ValueError):
                          continue

                      if stop <= start:
                          continue

                      if stop <= int(now.timestamp()):
                          continue

                      if start >= int(window_end.timestamp()):
                          continue

                      key = (start, stop, title, series)

                      item = {
                          "start": start,
                          "stop": stop,
                          "title": title,
                          "summary": summary,
                          "kind": kind,
                          "series": series,
                          "season": season,
                          "episode": episode,
                          "year": year,
                          "rating": rating,
                      }

                      if key not in programmes:
                          programmes[key] = item
                          found_today += 1

              print(f"  Added {found_today} new listings.")
              time.sleep(1)

          if not programmes:
              raise SystemExit(
                  "Plex returned no usable programmes across the "
                  "14-day window. No guide was written."
              )

          tv = ET.Element("tv", {
              "source-info-name": "Plex EPG",
              "generator-info-name": "festy-epg MGM Horror",
          })

          channel = ET.SubElement(
              tv, "channel", {"id": XMLTV_CHANNEL_ID}
          )
          ET.SubElement(channel, "display-name").text = CHANNEL_NAME

          for item in sorted(
              programmes.values(),
              key=lambda p: (p["start"], p["stop"])
          ):
              programme = ET.SubElement(tv, "programme", {
                  "start": xmltv_time(item["start"]),
                  "stop": xmltv_time(item["stop"]),
                  "channel": XMLTV_CHANNEL_ID,
              })

              if item["kind"] == "episode" and item["series"]:
                  ET.SubElement(
                      programme, "title", {"lang": "en"}
                  ).text = item["series"]

                  ET.SubElement(
                      programme, "sub-title", {"lang": "en"}
                  ).text = item["title"]

                  if item["season"].isdigit() and item["episode"].isdigit():
                      ET.SubElement(
                          programme, "episode-num",
                          {"system": "xmltv_ns"}
                      ).text = (
                          f"{int(item['season']) - 1}."
                          f"{int(item['episode']) - 1}."
                      )
              else:
                  ET.SubElement(
                      programme, "title", {"lang": "en"}
                  ).text = item["title"]

              if item["summary"]:
                  ET.SubElement(
                      programme, "desc", {"lang": "en"}
                  ).text = item["summary"]

              if item["year"]:
                  ET.SubElement(programme, "date").text = item["year"]

              if item["rating"]:
                  rating = ET.SubElement(programme, "rating")
                  ET.SubElement(rating, "value").text = item["rating"]

          ET.indent(tv, space="  ")
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          xml_data = ET.tostring(
              tv,
              encoding="utf-8",
              xml_declaration=True,
          )

          with gzip.open(OUTPUT, "wb") as output:
              output.write(xml_data)

          print(f"Created {OUTPUT}")
          print(f"Total programme listings: {len(programmes)}")
          print(f"Window ends: {window_end.isoformat()}")
          PY

      - name: Validate generated guide
        run: |
          python3 - <<'PY'
          import gzip
          import xml.etree.ElementTree as ET

          path = "guides/mgm-horror.xml.gz"

          with gzip.open(path, "rb") as guide:
              root = ET.parse(guide).getroot()

          channels = root.findall("channel")
          programmes = root.findall("programme")

          if not channels:
              raise SystemExit("Guide has no channel element.")

          if not programmes:
              raise SystemExit("Guide has no programme listings.")

          print(f"Valid XMLTV: {len(programmes)} programmes")
          print(f"Channel: {channels[0].get('id')}")
          PY

      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guides/mgm-horror.xml.gz

          if git diff --cached --quiet; then
            echo "Guide has not changed."
          else
            git commit -m "Update MGM Presents Horror 14-day guide"
            git push
          fi
```
