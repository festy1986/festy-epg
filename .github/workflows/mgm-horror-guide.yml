name: MGM Presents Horror Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: mgm-horror-guide
  cancel-in-progress: false

jobs:
  build-guide:
    runs-on: ubuntu-latest

    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      MGM_HORROR_LOGO_URL: "https://provider-static.plex.tv/epg/cms/production/02b4d3c7-5397-46d6-ba78-811367ced717/MPHorror_Plex_Logo_color_wht_textRDX.png"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch Plex schedule, clean listings, enrich metadata, and build 17-day guide
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          # ============================================================
          # CONFIGURATION
          # ============================================================

          CHANNEL_GRID_KEY = "6abd4e58a9d133322be5f940"

          XMLTV_CHANNEL_ID = "mgm-presents-horror"
          CHANNEL_NAME = "MGM Presents: Horror"

          OUTPUT = Path("guides/mgm-horror.xml.gz")

          # Request extra days so the guide never gets unnecessarily
          # cut off at the provider's normal published horizon.
          DAYS = 17

          PLEX_BASE_URL = "https://epg.provider.plex.tv/grid"

          TMDB_BASE_URL = "https://api.themoviedb.org/3"
          TVMAZE_BASE_URL = "https://api.tvmaze.com"

          TMDB_API_TOKEN = os.environ.get(
              "TMDB_API_TOKEN",
              ""
          ).strip()

          CONFIGURED_LOGO_URL = os.environ.get(
              "MGM_HORROR_LOGO_URL",
              ""
          ).strip()

          USER_AGENT = "festy-epg/1.0"

          # ------------------------------------------------------------
          # FAIL-SAFE SETTINGS
          #
          # These are intentionally based on the amount of usable
          # programming, NOT on the number of populated days.
          #
          # Plex may legitimately stop returning data after 14, 15,
          # or 16 days. That is allowed.
          # ------------------------------------------------------------

          MINIMUM_TOTAL_PROGRAMMES = 40

          # If an existing guide is available, the new guide must
          # retain at least this percentage of its overlapping
          # programmes. This protects against a partial Plex response.
          MINIMUM_OVERLAP_RATIO = 0.50

          now = datetime.now(timezone.utc)

          window_end = (
              now +
              timedelta(days=DAYS)
          )

          now_timestamp = int(
              now.timestamp()
          )

          end_timestamp = int(
              window_end.timestamp()
          )

          programmes = {}

          daily_counts = {}

          channel_logo_url = ""

          # ============================================================
          # HTTP HELPERS
          # ============================================================

          def request_bytes(
              url,
              headers=None,
              attempts=3
          ):
              request_headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "*/*",
              }

              if headers:
                  request_headers.update(headers)

              request = urllib.request.Request(
                  url,
                  headers=request_headers
              )

              last_error = None

              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:
                          return response.read()

                  except Exception as exc:
                      last_error = exc

                      print(
                          f"Request attempt "
                          f"{attempt + 1}/{attempts} failed: "
                          f"{exc}"
                      )

                      if attempt + 1 < attempts:
                          time.sleep(
                              2 * (attempt + 1)
                          )

              raise RuntimeError(
                  f"Request failed after {attempts} attempts: "
                  f"{last_error}"
              )

          def request_json(
              url,
              headers=None
          ):
              try:
                  body = request_bytes(
                      url,
                      headers=headers
                  )

                  return json.loads(
                      body.decode("utf-8")
                  )

              except Exception as exc:
                  print(
                      f"Metadata lookup failed: {exc}"
                  )

                  return None

          # ============================================================
          # PLEX
          # ============================================================

          def fetch_day(day):
              params = urllib.parse.urlencode({
                  "channelGridKey": CHANNEL_GRID_KEY,
                  "date": day.isoformat(),
                  "x-plex-provider-version": "7.0.0",
              })

              url = (
                  f"{PLEX_BASE_URL}?{params}"
              )

              body = request_bytes(
                  url,
                  headers={
                      "Accept": "application/xml",
                      "X-Plex-Language": "en",
                  }
              )

              root = ET.fromstring(
                  body
              )

              if root.tag != "MediaContainer":
                  raise RuntimeError(
                      f"Unexpected Plex XML root: "
                      f"{root.tag}"
                  )

              return root

          def find_channel_logo(root):
              """
              Look for actual channel/provider artwork.

              We deliberately do not use a programme thumbnail
              as the channel logo.
              """

              possible_attributes = (
                  "channelLogo",
                  "channelIcon",
                  "channelThumb",
                  "logo",
                  "icon",
              )

              for attribute in possible_attributes:
                  value = (
                      root.get(attribute, "")
                      .strip()
                  )

                  if value.startswith(
                      ("https://", "http://")
                  ):
                      return value

              for element in root.iter():
                  if element.tag.lower() not in (
                      "channel",
                      "directory",
                      "provider",
                  ):
                      continue

                  for attribute in (
                      "channelLogo",
                      "channelIcon",
                      "channelThumb",
                      "logo",
                      "icon",
                      "thumb",
                      "art",
                  ):
                      value = (
                          element.get(
                              attribute,
                              ""
                          ).strip()
                      )

                      if value.startswith(
                          ("https://", "http://")
                      ):
                          return value

              return ""

          # ============================================================
          # CLEANUP
          # ============================================================

          def clean_spaces(value):
              if not value:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(value)
              ).strip()

          def extract_year(value):
              if not value:
                  return ""

              match = re.search(
                  r"\s+\(((?:18|19|20|21)\d{2})\)\s*$",
                  value
              )

              if match:
                  return match.group(1)

              return ""

          def clean_programme_title(value):
              value = clean_spaces(
                  value
              )

              # Remove trailing movie year:
              #
              # Halloween (1978)
              # The Texas Chain Saw Massacre (1974)
              #
              value = re.sub(
                  r"\s+\(((?:18|19|20|21)\d{2})\)\s*$",
                  "",
                  value
              )

              # Remove common trailing episode markers.
              value = re.sub(
                  r"\s+(?:"
                  r"S\d{1,3}\s*E\d{1,4}"
                  r"|Season\s+\d+\s+Episode\s+\d+"
                  r")\s*$",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              return clean_spaces(
                  value
              )

          def remove_embedded_credits(value):
              value = clean_spaces(
                  value
              )

              if not value:
                  return ""

              protected_dates = []

              def protect_date(match):
                  token = (
                      f"__AIRDATE_"
                      f"{len(protected_dates)}__"
                  )

                  protected_dates.append(
                      match.group(0)
                  )

                  return token

              value = re.sub(
                  r"\(\d{1,2}/\d{1,2}/\d{4}\)",
                  protect_date,
                  value
              )

              value = re.sub(
                  r"\([^()]*\)",
                  "",
                  value
              )

              value = re.sub(
                  r"\s+[A-Z][A-Za-z.'-]*"
                  r"(?:\s*,\s*[A-Z][A-Za-z.'-]*)*"
                  r"(?:\s+(?:and|&)\s+"
                  r"[A-Z][A-Za-z.'-]*)"
                  r"\s+(?:star|stars|starring)\.?"
                  r"\s*$",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              value = re.sub(
                  r"\s+(?:with|featuring|"
                  r"featuring performances by|"
                  r"with performances by)\s+"
                  r"[^.!?]*[.!?]?\s*$",
                  "",
                  value,
                  flags=re.IGNORECASE
              )

              value = re.sub(
                  r"\s+\*+\s*$",
                  "",
                  value
              )

              value = re.sub(
                  r"\s+\.\s*$",
                  "",
                  value
              )

              value = re.sub(
                  r"\s{2,}",
                  " ",
                  value
              ).strip()

              for index, date_value in enumerate(
                  protected_dates
              ):
                  value = value.replace(
                      f"__AIRDATE_{index}__",
                      date_value
                  )

              return clean_spaces(
                  value
              )

          def clean_description(value):
              if not value:
                  return ""

              value = re.sub(
                  r"<br\s*/?>",
                  " ",
                  value,
                  flags=re.IGNORECASE
              )

              value = re.sub(
                  r"</p\s*>",
                  " ",
                  value,
                  flags=re.IGNORECASE
              )

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value
              )

              return remove_embedded_credits(
                  value
              )

          # ============================================================
          # TVMAZE
          # ============================================================

          tvmaze_show_cache = {}
          tvmaze_episode_cache = {}

          def tvmaze_find_show(series_name):
              key = clean_spaces(
                  series_name
              ).casefold()

              if key in tvmaze_show_cache:
                  return tvmaze_show_cache[key]

              url = (
                  f"{TVMAZE_BASE_URL}/search/shows?"
                  +
                  urllib.parse.urlencode({
                      "q": series_name
                  })
              )

              result = request_json(
                  url
              )

              show = None

              if (
                  isinstance(result, list)
                  and result
              ):
                  for entry in result:
                      candidate = (
                          entry.get("show")
                          or {}
                      )

                      candidate_name = (
                          clean_spaces(
                              candidate.get(
                                  "name",
                                  ""
                              )
                          )
                      )

                      if (
                          candidate_name.casefold()
                          == key
                      ):
                          show = candidate
                          break

                  if show is None:
                      show = (
                          result[0].get("show")
                      )

              tvmaze_show_cache[key] = show

              time.sleep(0.25)

              return show

          def tvmaze_get_episode(
              series_name,
              season,
              episode
          ):
              key = (
                  clean_spaces(
                      series_name
                  ).casefold(),
                  season,
                  episode
              )

              if key in tvmaze_episode_cache:
                  return tvmaze_episode_cache[key]

              show = tvmaze_find_show(
                  series_name
              )

              if (
                  not show
                  or not show.get("id")
              ):
                  tvmaze_episode_cache[key] = None
                  return None

              params = urllib.parse.urlencode({
                  "season": season,
                  "number": episode,
              })

              url = (
                  f"{TVMAZE_BASE_URL}/shows/"
                  f"{show['id']}/episodebynumber?"
                  f"{params}"
              )

              result = request_json(
                  url
              )

              tvmaze_episode_cache[key] = (
                  result
                  if isinstance(
                      result,
                      dict
                  )
                  else None
              )

              time.sleep(0.25)

              return tvmaze_episode_cache[key]

          # ============================================================
          # TMDB
          # ============================================================

          tmdb_show_cache = {}
          tmdb_episode_cache = {}

          def tmdb_headers():
              return {
                  "Authorization":
                      "Bearer " +
                      TMDB_API_TOKEN,

                  "Accept":
                      "application/json",
              }

          def tmdb_find_show(series_name):
              if not TMDB_API_TOKEN:
                  return None

              key = clean_spaces(
                  series_name
              ).casefold()

              if key in tmdb_show_cache:
                  return tmdb_show_cache[key]

              url = (
                  f"{TMDB_BASE_URL}/search/tv?"
                  +
                  urllib.parse.urlencode({
                      "query": series_name,
                      "include_adult": "false",
                  })
              )

              result = request_json(
                  url,
                  headers=tmdb_headers()
              )

              show = None

              if isinstance(result, dict):
                  results = (
                      result.get(
                          "results",
                          []
                      )
                  )

                  for candidate in results:
                      if (
                          clean_spaces(
                              candidate.get(
                                  "name",
                                  ""
                              )
                          ).casefold()
                          == key
                      ):
                          show = candidate
                          break

                  if (
                      show is None
                      and results
                  ):
                      show = results[0]

              tmdb_show_cache[key] = show

              time.sleep(0.25)

              return show

          def tmdb_get_episode(
              series_name,
              season,
              episode
          ):
              if not TMDB_API_TOKEN:
                  return None

              key = (
                  clean_spaces(
                      series_name
                  ).casefold(),
                  season,
                  episode
              )

              if key in tmdb_episode_cache:
                  return tmdb_episode_cache[key]

              show = tmdb_find_show(
                  series_name
              )

              if (
                  not show
                  or not show.get("id")
              ):
                  tmdb_episode_cache[key] = None
                  return None

              url = (
                  f"{TMDB_BASE_URL}/tv/"
                  f"{show['id']}/season/"
                  f"{season}/episode/"
                  f"{episode}"
              )

              result = request_json(
                  url,
                  headers=tmdb_headers()
              )

              tmdb_episode_cache[key] = (
                  result
                  if isinstance(
                      result,
                      dict
                  )
                  else None
              )

              time.sleep(0.25)

              return tmdb_episode_cache[key]

          # ============================================================
          # METADATA ENRICHMENT
          # ============================================================

          def enrich_episode(item):
              if (
                  item["kind"] != "episode"
                  or not item["series"]
                  or not item["season"].isdigit()
                  or not item["episode"].isdigit()
              ):
                  return

              season = int(
                  item["season"]
              )

              episode = int(
                  item["episode"]
              )

              if (
                  season < 1
                  or episode < 1
              ):
                  return

              needs_more = (
                  not item["episode_title"]
                  or not item["summary"]
                  or not item["air_date"]
                  or not item["episode_icon"]
              )

              if not needs_more:
                  return

              # --------------------------------------------------------
              # TVMAZE FIRST
              # --------------------------------------------------------

              tvmaze = tvmaze_get_episode(
                  item["series"],
                  season,
                  episode
              )

              if isinstance(
                  tvmaze,
                  dict
              ):
                  if not item["episode_title"]:
                      item["episode_title"] = (
                          clean_programme_title(
                              tvmaze.get(
                                  "name",
                                  ""
                              )
                          )
                      )

                  if not item["summary"]:
                      item["summary"] = (
                          clean_description(
                              tvmaze.get(
                                  "summary",
                                  ""
                              )
                          )
                      )

                  if not item["air_date"]:
                      item["air_date"] = (
                          tvmaze.get(
                              "airdate",
                              ""
                          )
                          or ""
                      )

                  if not item["episode_icon"]:
                      images = (
                          tvmaze.get(
                              "image"
                          )
                          or {}
                      )

                      item["episode_icon"] = (
                          images.get(
                              "original"
                          )
                          or images.get(
                              "medium"
                          )
                          or ""
                      )

              # --------------------------------------------------------
              # TMDB SECOND
              # --------------------------------------------------------

              if (
                  (
                      not item["episode_title"]
                      or not item["summary"]
                      or not item["air_date"]
                      or not item["episode_icon"]
                  )
                  and TMDB_API_TOKEN
              ):
                  tmdb = tmdb_get_episode(
                      item["series"],
                      season,
                      episode
                  )

                  if isinstance(
                      tmdb,
                      dict
                  ):
                      if not item["episode_title"]:
                          item["episode_title"] = (
                              clean_programme_title(
                                  tmdb.get(
                                      "name",
                                      ""
                                  )
                              )
                          )

                      if not item["summary"]:
                          item["summary"] = (
                              clean_description(
                                  tmdb.get(
                                      "overview",
                                      ""
                                  )
                              )
                          )

                      if not item["air_date"]:
                          item["air_date"] = (
                              tmdb.get(
                                  "air_date",
                                  ""
                              )
                              or ""
                          )

                      if not item["episode_icon"]:
                          still_path = (
                              tmdb.get(
                                  "still_path",
                                  ""
                              )
                              or ""
                          )

                          if still_path.startswith(
                              "/"
                          ):
                              item["episode_icon"] = (
                                  "https://image.tmdb.org/"
                                  "t/p/w500"
                                  + still_path
                              )

          # ============================================================
          # FETCH ALL AVAILABLE PLEX DATA
          # ============================================================

          first_day = now.date()

          print(
              f"Building {DAYS}-day guide "
              f"starting {first_day}."
          )

          print(
              f"Window ends: "
              f"{window_end.isoformat()}"
          )

          failed_days = []

          for offset in range(DAYS):
              day = (
                  first_day +
                  timedelta(days=offset)
              )

              print(
                  f"Fetching Plex schedule "
                  f"for {day}..."
              )

              try:
                  root = fetch_day(
                      day
                  )

              except Exception as exc:
                  print(
                      f"WARNING: Plex request "
                      f"failed for {day}: {exc}"
                  )

                  failed_days.append(
                      day.isoformat()
                  )

                  continue

              if not channel_logo_url:
                  channel_logo_url = (
                      find_channel_logo(
                          root
                      )
                  )

              videos = list(
                  root.iter("Video")
              )

              daily_counts[
                  day.isoformat()
              ] = len(videos)

              found_today = 0

              print(
                  f"  Plex returned "
                  f"{len(videos)} programme records."
              )

              for video in videos:
                  raw_title = (
                      video.get(
                          "title",
                          ""
                      ).strip()
                  )

                  kind = (
                      video.get(
                          "type",
                          ""
                      ).strip().lower()
                  )

                  series = (
                      clean_programme_title(
                          video.get(
                              "grandparentTitle",
                              ""
                          )
                      )
                  )

                  raw_year = (
                      video.get(
                          "year",
                          ""
                      ).strip()
                  )

                  title = (
                      clean_programme_title(
                          raw_title
                      )
                  )

                  # If Plex supplied a year in the title, remove it
                  # from the displayed title but retain it as the
                  # programme date when possible.
                  year = (
                      raw_year
                      or extract_year(
                          raw_title
                      )
                  )

                  summary = clean_description(
                      video.get(
                          "summary",
                          ""
                      )
                  )

                  season = (
                      video.get(
                          "parentIndex",
                          ""
                      ).strip()
                  )

                  episode = (
                      video.get(
                          "index",
                          ""
                      ).strip()
                  )

                  rating = (
                      video.get(
                          "contentRating",
                          ""
                      ).strip()
                  )

                  # A movie must have a usable title.
                  #
                  # For an episode, the series name can serve as the
                  # programme title if Plex's episode title is absent.
                  if (
                      not title
                      and not (
                          kind == "episode"
                          and series
                      )
                  ):
                      print(
                          "  Skipping Plex record "
                          "with no usable title."
                      )

                      continue

                  for media in video.findall(
                      "Media"
                  ):
                      begins = (
                          media.get(
                              "beginsAt"
                          )
                      )

                      ends = (
                          media.get(
                              "endsAt"
                          )
                      )

                      if not begins or not ends:
                          continue

                      try:
                          start = int(
                              begins
                          )

                          stop = int(
                              ends
                          )

                      except (
                          TypeError,
                          ValueError
                      ):
                          continue

                      if stop <= start:
                          continue

                      if stop <= now_timestamp:
                          continue

                      if start >= end_timestamp:
                          continue

                      key = (
                          start,
                          stop,
                          title.casefold(),
                          series.casefold(),
                      )

                      item = {
                          "start": start,
                          "stop": stop,
                          "title": title,
                          "summary": summary,
                          "kind": kind,
                          "series": series,
                          "season": season,
                          "episode": episode,
                          "year": year,
                          "rating": rating,
                          "episode_title": (
                              title
                              if (
                                  kind == "episode"
                                  and series
                              )
                              else ""
                          ),
                          "air_date": "",
                          "episode_icon": "",
                      }

                      if key not in programmes:
                          programmes[key] = item
                          found_today += 1

              print(
                  f"  Added "
                  f"{found_today} new listings."
              )

              time.sleep(1)

          # ============================================================
          # BASIC FAIL-SAFE
          # ============================================================

          total_programmes = len(
              programmes
          )

          print("")
          print("========================================")
          print("PLEX FETCH SUMMARY")
          print("========================================")
          print(
              f"Total usable programmes: "
              f"{total_programmes}"
          )

          for day, count in daily_counts.items():
              print(
                  f"{day}: {count} Plex records"
              )

          if failed_days:
              print(
                  "Days where Plex request failed: "
                  +
                  ", ".join(
                      failed_days
                  )
              )

          # A normal Plex horizon can end before day 17.
          #
          # What is NOT normal is receiving almost nothing.
          if total_programmes < MINIMUM_TOTAL_PROGRAMMES:
              raise SystemExit(
                  "FAIL-SAFE TRIGGERED: Plex returned only "
                  f"{total_programmes} usable programmes. "
                  f"Minimum required is "
                  f"{MINIMUM_TOTAL_PROGRAMMES}. "
                  "The existing guide will NOT be replaced."
              )

          # ============================================================
          # EXISTING-GUIDE OVERLAP FAIL-SAFE
          # ============================================================

          existing_keys = set()

          if OUTPUT.exists():
              try:
                  print("")
                  print(
                      "Checking existing guide for "
                      "overlap protection..."
                  )

                  with gzip.open(
                      OUTPUT,
                      "rb"
                  ) as existing_file:
                      existing_root = (
                          ET.parse(
                              existing_file
                          ).getroot()
                      )

                  for programme in (
                      existing_root.findall(
                          "programme"
                      )
                  ):
                      start = (
                          programme.get(
                              "start",
                              ""
                          )
                      )

                      stop = (
                          programme.get(
                              "stop",
                              ""
                          )
                      )

                      title_element = (
                          programme.find(
                              "title"
                          )
                      )

                      if (
                          not start
                          or not stop
                          or title_element is None
                      ):
                          continue

                      title = clean_spaces(
                          title_element.text
                          or ""
                      )

                      subtitle_element = (
                          programme.find(
                              "sub-title"
                          )
                      )

                      subtitle = clean_spaces(
                          (
                              subtitle_element.text
                              or ""
                          )
                          if (
                              subtitle_element
                              is not None
                          )
                          else ""
                      )

                      existing_keys.add(
                          (
                              start,
                              stop,
                              title.casefold(),
                              subtitle.casefold(),
                          )
                      )

                  print(
                      f"Existing guide contains "
                      f"{len(existing_keys)} "
                      "usable programme keys."
                  )

              except Exception as exc:
                  print(
                      "WARNING: Could not read the "
                      f"existing guide for overlap "
                      f"checking: {exc}"
                  )

          if existing_keys:
              new_keys = set()

              for item in programmes.values():
                  start_text = (
                      datetime.fromtimestamp(
                          item["start"],
                          timezone.utc
                      ).strftime(
                          "%Y%m%d%H%M%S +0000"
                      )
                  )

                  stop_text = (
                      datetime.fromtimestamp(
                          item["stop"],
                          timezone.utc
                      ).strftime(
                          "%Y%m%d%H%M%S +0000"
                      )
                  )

                  # For episodes, the existing XMLTV guide stores
                  # the series as title and episode title as subtitle.
                  if (
                      item["kind"] == "episode"
                      and item["series"]
                  ):
                      comparison_title = (
                          item["series"]
                      )

                      comparison_subtitle = (
                          item["title"]
                      )

                  else:
                      comparison_title = (
                          item["title"]
                      )

                      comparison_subtitle = ""

                  new_keys.add(
                      (
                          start_text,
                          stop_text,
                          comparison_title.casefold(),
                          comparison_subtitle.casefold(),
                      )
                  )

              # Only compare existing programmes that overlap the
              # current 17-day window. Old expired entries do not count.
              current_existing_keys = set()

              for key in existing_keys:
                  start_text = key[0]

                  try:
                      parsed = datetime.strptime(
                          start_text,
                          "%Y%m%d%H%M%S +0000"
                      ).replace(
                          tzinfo=timezone.utc
                      )

                  except ValueError:
                      continue

                  if (
                      parsed.timestamp()
                      >= now_timestamp
                  ):
                      current_existing_keys.add(
                          key
                      )

              if current_existing_keys:
                  overlap = (
                      len(
                          current_existing_keys
                          & new_keys
                      )
                  )

                  overlap_ratio = (
                      overlap /
                      len(
                          current_existing_keys
                      )
                  )

                  print(
                      "Existing/new overlap: "
                      f"{overlap}/"
                      f"{len(current_existing_keys)} "
                      f"({overlap_ratio:.1%})"
                  )

                  if (
                      overlap_ratio
                      < MINIMUM_OVERLAP_RATIO
                  ):
                      raise SystemExit(
                          "FAIL-SAFE TRIGGERED: The new "
                          "Plex result contains too little "
                          "overlap with the existing guide "
                          f"({overlap_ratio:.1%}). "
                          "The existing guide will NOT be "
                          "replaced."
                      )

          # ============================================================
          # METADATA ENRICHMENT
          # ============================================================

          episode_count = sum(
              1
              for item in programmes.values()
              if (
                  item["kind"]
                  == "episode"
              )
          )

          print("")
          print(
              f"Checking metadata for "
              f"{episode_count} identified episodes."
          )

          for index, item in enumerate(
              programmes.values(),
              start=1
          ):
              if (
                  item["kind"]
                  == "episode"
              ):
                  enrich_episode(
                      item
                  )

              if index % 25 == 0:
                  print(
                      f"Processed metadata for "
                      f"{index}/"
                      f"{len(programmes)} listings."
                  )

          # ============================================================
          # CHANNEL LOGO
          # ============================================================

          if (
              not channel_logo_url
              and CONFIGURED_LOGO_URL.startswith(
                  ("https://", "http://")
              )
          ):
              channel_logo_url = (
                  CONFIGURED_LOGO_URL
              )

          if channel_logo_url:
              print(
                  "Channel logo configured: "
                  f"{channel_logo_url}"
              )

          else:
              print(
                  "WARNING: Plex did not provide a "
                  "channel logo and "
                  "MGM_HORROR_LOGO_URL is not configured."
              )

          # ============================================================
          # BUILD XMLTV
          # ============================================================

          def xmltv_time(timestamp):
              return datetime.fromtimestamp(
                  timestamp,
                  timezone.utc
              ).strftime(
                  "%Y%m%d%H%M%S +0000"
              )

          tv = ET.Element(
              "tv",
              {
                  "source-info-name":
                      "Plex EPG",

                  "generator-info-name":
                      "festy-epg MGM Horror",
              }
          )

          channel = ET.SubElement(
              tv,
              "channel",
              {
                  "id":
                      XMLTV_CHANNEL_ID
              }
          )

          if channel_logo_url:
              ET.SubElement(
                  channel,
                  "icon",
                  {
                      "src":
                          channel_logo_url
                  }
              )

          ET.SubElement(
              channel,
              "display-name"
          ).text = CHANNEL_NAME

          for item in sorted(
              programmes.values(),
              key=lambda entry: (
                  entry["start"],
                  entry["stop"]
              )
          ):
              programme = ET.SubElement(
                  tv,
                  "programme",
                  {
                      "start":
                          xmltv_time(
                              item["start"]
                          ),

                      "stop":
                          xmltv_time(
                              item["stop"]
                          ),

                      "channel":
                          XMLTV_CHANNEL_ID,
                  }
              )

              if (
                  item["kind"]
                  == "episode"
                  and item["series"]
              ):
                  # Series name is the main XMLTV title.
                  ET.SubElement(
                      programme,
                      "title",
                      {"lang": "en"}
                  ).text = (
                      item["series"]
                  )

                  # Clean episode/movie title is the subtitle.
                  if item["title"]:
                      ET.SubElement(
                          programme,
                          "sub-title",
                          {"lang": "en"}
                      ).text = (
                          item["title"]
                      )

                  if (
                      item["season"].isdigit()
                      and item["episode"].isdigit()
                  ):
                      season_number = int(
                          item["season"]
                      )

                      episode_number = int(
                          item["episode"]
                      )

                      if (
                          season_number >= 1
                          and episode_number >= 1
                      ):
                          ET.SubElement(
                              programme,
                              "episode-num",
                              {
                                  "system":
                                      "xmltv_ns"
                              }
                          ).text = (
                              f"{season_number - 1}."
                              f"{episode_number - 1}."
                          )

              else:
                  ET.SubElement(
                      programme,
                      "title",
                      {"lang": "en"}
                  ).text = (
                      item["title"]
                  )

              if item["summary"]:
                  ET.SubElement(
                      programme,
                      "desc",
                      {"lang": "en"}
                  ).text = (
                      item["summary"]
                  )

              if (
                  item["kind"]
                  == "episode"
              ):
                  date_value = (
                      item["air_date"]
                  )
              else:
                  date_value = (
                      item["year"]
                  )

              if date_value:
                  ET.SubElement(
                      programme,
                      "date"
                  ).text = date_value

              if item["rating"]:
                  rating_element = (
                      ET.SubElement(
                          programme,
                          "rating"
                      )
                  )

                  ET.SubElement(
                      rating_element,
                      "value"
                  ).text = (
                      item["rating"]
                  )

              if item["episode_icon"].startswith(
                  ("https://", "http://")
              ):
                  ET.SubElement(
                      programme,
                      "icon",
                      {
                          "src":
                              item["episode_icon"]
                      }
                  )

          ET.indent(
              tv,
              space="  "
          )

          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          xml_data = ET.tostring(
              tv,
              encoding="utf-8",
              xml_declaration=True
          )

          with gzip.open(
              OUTPUT,
              "wb"
          ) as output:
              output.write(
                  xml_data
              )

          print("")
          print(
              "Created "
              f"{OUTPUT}"
          )

          print(
              "Total programme listings: "
              f"{len(programmes)}"
          )

          print(
              "Episode listings: "
              f"{episode_count}"
          )

          print(
              "Guide window requested: "
              f"{DAYS} days"
          )

          print(
              "Guide window ends: "
              f"{window_end.isoformat()}"
          )

          print("")
          print(
              "Plex did not need to provide all "
              f"{DAYS} days. The guide contains "
              "everything Plex supplied within the "
              "requested window."
          )
          PY

