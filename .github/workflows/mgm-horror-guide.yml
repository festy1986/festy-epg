```yaml
name: MGM Presents Horror Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: mgm-horror-guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build 14-day MGM Horror guide
        run: |
          python3 - <<'PY'
          import gzip
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          SOURCE = "https://iptv-epg.org/files/epg-us.xml.gz"
          CHANNEL_ID = "MGMPresentsHorror.us"
          OUTPUT = Path("guides/mgm-horror.xml.gz")

          now = datetime.now(timezone.utc)
          cutoff = now + timedelta(days=14)

          request = urllib.request.Request(
              SOURCE,
              headers={"User-Agent": "festy-epg/1.0"}
          )

          print("Downloading IPTV-EPG US guide...")

          with urllib.request.urlopen(request, timeout=180) as response:
              data = response.read()

          print(f"Downloaded {len(data):,} bytes.")

          # Accept the source as a compressed XMLTV file.
          if data[:2] == b"\x1f\x8b":
              data = gzip.decompress(data)

          source_root = ET.fromstring(data)

          output_root = ET.Element("tv", {
              "source-info-name": "IPTV-EPG",
              "generator-info-name": "festy-epg MGM Horror",
          })

          channel_found = False

          for channel in source_root.findall("channel"):
              if channel.get("id") == CHANNEL_ID:
                  output_root.append(channel)
                  channel_found = True
                  break

          if not channel_found:
              raise SystemExit(
                  f"Channel {CHANNEL_ID} not found in source guide. "
                  "No output published."
              )

          kept = 0

          for programme in source_root.findall("programme"):
              if programme.get("channel") != CHANNEL_ID:
                  continue

              start_text = programme.get("start", "")
              stop_text = programme.get("stop", "")

              try:
                  start = datetime.strptime(
                      start_text[:14], "%Y%m%d%H%M%S"
                  )
                  stop = datetime.strptime(
                      stop_text[:14], "%Y%m%d%H%M%S"
                  )

                  # XMLTV timestamps may include a numeric timezone.
                  import re
                  match = re.search(r"([+-]\d{4})$", start_text)
                  if match:
                      offset = match.group(1)
                      sign = 1 if offset[0] == "+" else -1
                      from datetime import timedelta
                      tz = timezone(sign * timedelta(
                          hours=int(offset[1:3]),
                          minutes=int(offset[3:5])
                      ))
                      start = start.replace(tzinfo=tz).astimezone(timezone.utc)
                  else:
                      start = start.replace(tzinfo=timezone.utc)

                  match = re.search(r"([+-]\d{4})$", stop_text)
                  if match:
                      offset = match.group(1)
                      sign = 1 if offset[0] == "+" else -1
                      tz = timezone(sign * timedelta(
                          hours=int(offset[1:3]),
                          minutes=int(offset[3:5])
                      ))
                      stop = stop.replace(tzinfo=tz).astimezone(timezone.utc)
                  else:
                      stop = stop.replace(tzinfo=timezone.utc)

              except ValueError:
                  print(f"Skipping invalid programme time: {start_text}")
                  continue

              if stop <= now or start >= cutoff:
                  continue

              output_root.append(programme)
              kept += 1

          if kept == 0:
              raise SystemExit(
                  "No MGM Horror programmes found in the 14-day window. "
                  "No output published."
              )

          ET.indent(output_root, space="  ")
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          xml_bytes = ET.tostring(
              output_root,
              encoding="utf-8",
              xml_declaration=True
          )

          with gzip.open(OUTPUT, "wb") as output:
              output.write(xml_bytes)

          print(f"Created {OUTPUT}")
          print(f"Programmes retained: {kept}")
          print("Window: now through the next 14 days.")
          PY

      - name: Commit guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/mgm-horror.xml.gz
          if git diff --cached --quiet; then
            echo "Guide has not changed."
          else
            git commit -m "Build MGM Presents Horror 14-day guide"
            git push
          fi
```
