
name: MGM Presents Horror Guide

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: mgm-horror-guide
  cancel-in-progress: false

jobs:
  build-guide:
    runs-on: ubuntu-latest

    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      MGM_HORROR_LOGO_URL: ${{ secrets.MGM_HORROR_LOGO_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Plex schedule, clean listings, enrich metadata, and build 17-day guide
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          # ------------------------------------------------------------
          # CONFIGURATION
          # ------------------------------------------------------------

          CHANNEL_GRID_KEY = "6abd4e58a9d133322be5f940"

          XMLTV_CHANNEL_ID = "mgm-presents-horror"
          CHANNEL_NAME = "MGM Presents: Horror"

          OUTPUT = Path("guides/mgm-horror.xml.gz")
          DAYS = 17

          PLEX_BASE_URL = "https://epg.provider.plex.tv/grid"
          TVMAZE_BASE_URL = "https://api.tvmaze.com"
          TMDB_BASE_URL = "https://api.themoviedb.org/3"

          TMDB_API_TOKEN = os.environ.get(
              "TMDB_API_TOKEN", ""
          ).strip()

          CONFIGURED_LOGO_URL = os.environ.get(
              "MGM_HORROR_LOGO_URL", ""
          ).strip()

          USER_AGENT = "festy-epg/1.0"

          now = datetime.now(timezone.utc)
          window_end = now + timedelta(days=DAYS)

          now_timestamp = int(now.timestamp())
          end_timestamp = int(window_end.timestamp())

          programmes = {}
          tvmaze_show_cache = {}
          tvmaze_episode_cache = {}
          tmdb_show_cache = {}
          tmdb_episode_cache = {}

          channel_logo_url = ""

          # ------------------------------------------------------------
          # HTTP HELPERS
          # ------------------------------------------------------------

          def request_bytes(url, headers=None, attempts=3):
              request_headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "*/*",
              }

              if headers:
                  request_headers.update(headers)

              request = urllib.request.Request(
                  url,
                  headers=request_headers,
              )

              last_error = None

              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(
                          request, timeout=45
                      ) as response:
                          return response.read()

                  except Exception as exc:
                      last_error = exc

                      print(
                          f"Request attempt {attempt + 1}/"
                          f"{attempts} failed: {url}: {exc}"
                      )

                      if attempt + 1 < attempts:
                          time.sleep(2 * (attempt + 1))

              raise RuntimeError(
                  f"Request failed after {attempts} attempts: "
                  f"{url}: {last_error}"
              )

          def request_json(url, headers=None):
              try:
                  body = request_bytes(
                      url,
                      headers=headers,
                  )

                  return json.loads(body.decode("utf-8"))

              except Exception as exc:
                  print(f"Metadata lookup failed: {exc}")
                  return None

          # ------------------------------------------------------------
          # PLEX SCHEDULE
          # ------------------------------------------------------------

          def fetch_day(day):
              params = urllib.parse.urlencode({
                  "channelGridKey": CHANNEL_GRID_KEY,
                  "date": day.isoformat(),
                  "x-plex-provider-version": "7.0.0",
              })

              url = f"{PLEX_BASE_URL}?{params}"

              body = request_bytes(
                  url,
                  headers={
                      "Accept": "application/xml",
                      "X-Plex-Language": "en",
                  },
              )

              root = ET.fromstring(body)

              if root.tag != "MediaContainer":
                  raise RuntimeError(
                      f"Unexpected Plex XML root: {root.tag}"
                  )

              return root

          def child_text(element, name):
              child = element.find(name)

              if child is None or child.text is None:
                  return ""

              return child.text.strip()

          def find_channel_logo(root):
              """
              Look for channel-level artwork only.
              Never use a movie or programme thumbnail as the
              channel logo.
              """

              possible_names = (
                  "channelLogo",
                  "channelIcon",
                  "channelThumb",
                  "logo",
                  "icon",
              )

              for name in possible_names:
                  value = root.get(name, "").strip()

                  if value.startswith(("https://", "http://")):
                      return value

              for element in root.iter():
                  if element.tag.lower() not in (
                      "channel",
                      "directory",
                      "provider",
                  ):
                      continue

                  for name in (
                      *possible_names,
                      "thumb",
                      "art",
                  ):
                      value = element.get(name, "").strip()

                      if value.startswith(
                          ("https://", "http://")
                      ):
                          return value

              return ""

          # ------------------------------------------------------------
          # CLEANUP FUNCTIONS
          # ------------------------------------------------------------

          def clean_spaces(value):
              if not value:
                  return ""

              return re.sub(r"\s+", " ", value).strip()

          def extract_year(value):
              if not value:
                  return ""

              match = re.search(
                  r"\s+\(((?:18|19|20|21)\d{2})\)\s*$",
                  value,
              )

              return match.group(1) if match else ""

          def clean_programme_title(value):
              value = clean_spaces(value)

              # Remove trailing movie years, e.g. Halloween (1978).
              value = re.sub(
                  r"\s+\(((?:18|19|20|21)\d{2})\)\s*$",
                  "",
                  value,
              )

              # Remove trailing season/episode markers.
              value = re.sub(
                  r"\s+(?:S\d{1,3}\s*E\d{1,4}|"
                  r"Season\s+\d+\s+Episode\s+\d+)\s*$",
                  "",
                  value,
                  flags=re.IGNORECASE,
              )

              return clean_spaces(value)

          def remove_embedded_credits(value):
              """
              Remove common embedded credit text conservatively.
              Preserve date strings such as (10/31/2020).
              """

              value = clean_spaces(value)

              if not value:
                  return ""

              protected_dates = []

              def protect_date(match):
                  protected_dates.append(match.group(0))

                  return (
                      f"__PRESERVED_DATE_"
                      f"{len(protected_dates) - 1}__"
                  )

              value = re.sub(
                  r"\(\d{1,2}/\d{1,2}/\d{4}\)",
                  protect_date,
                  value,
              )

              # Remove parenthetical notes while retaining dates.
              value = re.sub(
                  r"\s*\([^()]*\)",
                  "",
                  value,
              )

              # Remove trailing promotional credits.
              value = re.sub(
                  r"\s+(?:starring|featuring|"
                  r"with special appearance by)\s+.+$",
                  "",
                  value,
                  flags=re.IGNORECASE,
              )

              value = re.sub(
                  r"\s+\*+\s*$",
                  "",
                  value,
              )

              value = re.sub(r"[\s.]+$", "", value)

              for index, date_value in enumerate(
                  protected_dates
              ):
                  value = value.replace(
                      f"__PRESERVED_DATE_{index}__",
                      date_value,
                  )

              return clean_spaces(value)

          def clean_description(value):
              # Plex and metadata APIs may supply HTML descriptions.
              value = re.sub(
                  r"<br\s*/?>",
                  " ",
                  value or "",
                  flags=re.IGNORECASE,
              )

              value = re.sub(
                  r"</p\s*>",
                  " ",
                  value,
                  flags=re.IGNORECASE,
              )

              value = re.sub(
                  r"<[^>]+>",
                  " ",
                  value,
              )

              return remove_embedded_credits(value)

          # ------------------------------------------------------------
          # TVMAZE ENRICHMENT
          # TVmaze fills missing fields only; Plex stays authoritative.
          # ------------------------------------------------------------

          def tvmaze_find_show(series_name):
              key = clean_spaces(series_name).casefold()

              if key in tvmaze_show_cache:
                  return tvmaze_show_cache[key]

              url = (
                  f"{TVMAZE_BASE_URL}/search/shows?"
                  + urllib.parse.urlencode({
                      "q": series_name,
                  })
              )

              result = request_json(url)
              show = None

              if isinstance(result, list) and result:
                  for entry in result:
                      candidate = entry.get("show") or {}

                      candidate_name = clean_spaces(
                          candidate.get("name", "")
                      )

                      if candidate_name.casefold() == key:
                          show = candidate
                          break

                  if show is None:
                      show = result[0].get("show")

              tvmaze_show_cache[key] = show

              time.sleep(0.25)

              return show

          def tvmaze_get_episode(
              series_name, season, episode
          ):
              key = (
                  clean_spaces(series_name).casefold(),
                  season,
                  episode,
              )

              if key in tvmaze_episode_cache:
                  return tvmaze_episode_cache[key]

              show = tvmaze_find_show(series_name)

              if not show or not show.get("id"):
                  tvmaze_episode_cache[key] = None
                  return None

              params = urllib.parse.urlencode({
                  "season": season,
                  "number": episode,
              })

              url = (
                  f"{TVMAZE_BASE_URL}/shows/"
                  f"{show['id']}/episodebynumber?{params}"
              )

              result = request_json(url)

              tvmaze_episode_cache[key] = (
                  result if isinstance(result, dict) else None
              )

              time.sleep(0.25)

              return tvmaze_episode_cache[key]

          # ------------------------------------------------------------
          # TMDB FALLBACK ENRICHMENT
          # Requires the existing TMDB_API_TOKEN repository secret.
          # ------------------------------------------------------------

          def tmdb_headers():
              return {
                  "Authorization": f"Bearer {TMDB_API_TOKEN}",
                  "Accept": "application/json",
              }

          def tmdb_find_show(series_name):
              if not TMDB_API_TOKEN:
                  return None

              key = clean_spaces(series_name).casefold()

              if key in tmdb_show_cache:
                  return tmdb_show_cache[key]

              url = (
                  f"{TMDB_BASE_URL}/search/tv?"
                  + urllib.parse.urlencode({
                      "query": series_name,
                      "include_adult": "false",
                  })
              )

              result = request_json(
                  url,
                  headers=tmdb_headers(),
              )

              show = None

              if isinstance(result, dict):
                  results = result.get("results", [])

                  for candidate in results:
                      if clean_spaces(
                          candidate.get("name", "")
                      ).casefold() == key:
                          show = candidate
                          break

                  if show is None and results:
                      show = results[0]

              tmdb_show_cache[key] = show

              return show

          def tmdb_get_episode(
              series_name, season, episode
          ):
              if not TMDB_API_TOKEN:
                  return None

              key = (
                  clean_spaces(series_name).casefold(),
                  season,
                  episode,
              )

              if key in tmdb_episode_cache:
                  return tmdb_episode_cache[key]

              show = tmdb_find_show(series_name)

              if not show or not show.get("id"):
                  tmdb_episode_cache[key] = None
                  return None

              url = (
                  f"{TMDB_BASE_URL}/tv/{show['id']}/season/"
                  f"{season}/episode/{episode}"
              )

              result = request_json(
                  url,
                  headers=tmdb_headers(),
              )

              tmdb_episode_cache[key] = (
                  result if isinstance(result, dict) else None
              )

              time.sleep(0.15)

              return tmdb_episode_cache[key]

          def enrich_episode(item):
              """
              Enrich actual numbered TV episodes only.
              Never replace existing Plex metadata with API data.
              """

              if (
                  item["kind"] != "episode"
                  or not item["series"]
                  or not item["season"].isdigit()
                  or not item["episode"].isdigit()
              ):
                  return

              season = int(item["season"])
              episode = int(item["episode"])

              if season < 1 or episode < 1:
                  return

              if not (
                  not item["title"]
                  or not item["summary"]
                  or not item["air_date"]
                  or not item["episode_icon"]
              ):
                  return

              tvmaze = tvmaze_get_episode(
                  item["series"],
                  season,
                  episode,
              )

              if isinstance(tvmaze, dict):
                  if not item["title"]:
                      item["title"] = clean_programme_title(
                          tvmaze.get("name", "")
                      )

                  if not item["summary"]:
                      item["summary"] = clean_description(
                          tvmaze.get("summary") or ""
                      )

                  if not item["air_date"]:
                      item["air_date"] = (
                          tvmaze.get("airdate") or ""
                      )

                  if not item["episode_icon"]:
                      images = tvmaze.get("image") or {}

                      item["episode_icon"] = (
                          images.get("original")
                          or images.get("medium")
                          or ""
                      )

              still_missing = (
                  not item["title"]
                  or not item["summary"]
                  or not item["air_date"]
                  or not item["episode_icon"]
              )

              if still_missing and TMDB_API_TOKEN:
                  tmdb = tmdb_get_episode(
                      item["series"],
                      season,
                      episode,
                  )

                  if isinstance(tmdb, dict):
                      if not item["title"]:
                          item["title"] = clean_programme_title(
                              tmdb.get("name", "")
                          )

                      if not item["summary"]:
                          item["summary"] = clean_description(
                              tmdb.get("overview", "")
                          )

                      if not item["air_date"]:
                          item["air_date"] = (
                              tmdb.get("air_date") or ""
                          )

                      if not item["episode_icon"]:
                          still_path = (
                              tmdb.get("still_path") or ""
                          )

                          if still_path.startswith("/"):
                              item["episode_icon"] = (
                                  "https://image.tmdb.org/t/p/w500"
                                  + still_path
                              )

          # ------------------------------------------------------------
          # FETCH THE FULL 17-DAY WINDOW FROM PLEX
          # ------------------------------------------------------------

          first_day = now.date()

          print(
              f"Building {DAYS}-day guide starting {first_day}."
          )
          print(f"Window ends: {window_end.isoformat()}")

          daily_counts = {}

          for offset in range(DAYS):
              day = first_day + timedelta(days=offset)

              print(f"Fetching Plex schedule for {day}...")

              root = fetch_day(day)

              if not channel_logo_url:
                  channel_logo_url = find_channel_logo(root)

              videos = list(root.iter("Video"))
              daily_counts[day.isoformat()] = len(videos)

              added_today = 0

              print(
                  f"  Plex returned {len(videos)} programme records."
              )

              for video in videos:
                  raw_title = video.get("title", "").strip()
                  kind = video.get("type", "").strip().lower()

                  series = clean_programme_title(
                      video.get("grandparentTitle", "")
                  )

                  raw_year = video.get("year", "").strip()
                  year = raw_year or extract_year(raw_title)

                  title = clean_programme_title(raw_title)

                  summary = clean_description(
                      video.get("summary", "")
                  )

                  season = video.get("parentIndex", "").strip()
                  episode = video.get("index", "").strip()
                  rating = video.get("contentRating", "").strip()

                  # Do not discard a record solely because an episode
                  # title is blank when Plex identifies its series.
                  if not title and not (
                      kind == "episode" and series
                  ):
                      print(
                          "  Skipping record with no usable title "
                          f"(type={kind!r}, rating={rating!r})."
                      )
                      continue

                  for media in video.findall("Media"):
                      begins = media.get("beginsAt")
                      ends = media.get("endsAt")

                      if not begins or not ends:
                          continue

                      try:
                          start = int(begins)
                          stop = int(ends)
                      except (TypeError, ValueError):
                          continue

                      if stop <= start:
                          continue

                      if stop <= now_timestamp:
                          continue

                      if start >= end_timestamp:
                          continue

                      key = (
                          start,
                          stop,
                          title.casefold(),
                          series.casefold(),
                      )

                      item = {
                          "start": start,
                          "stop": stop,
                          "title": title,
                          "summary": summary,
                          "kind": kind,
                          "series": series,
                          "season": season,
                          "episode": episode,
                          "year": year,
                          "rating": rating,
                          "air_date": "",
                          "episode_icon": "",
                      }

                      if key not in programmes:
                          programmes[key] = item
                          added_today += 1

              print(f"  Added {added_today} new listings.")
              time.sleep(1)

          if not programmes:
              raise SystemExit(
                  "Plex returned no usable programmes across the "
                  "17-day window. No guide was written."
              )

          # Report days where Plex returned unusually little data.
          # Do not invent programmes for dates Plex did not supply.
          sparse_days = [
              day
              for day, count in daily_counts.items()
              if count == 0
          ]

          if sparse_days:
              print(
                  "WARNING: Plex returned zero programme records "
                  "for these requested dates: "
                  + ", ".join(sparse_days)
              )

          # ------------------------------------------------------------
          # ENRICH TV EPISODES
          # ------------------------------------------------------------

          episode_count = sum(
              1
              for item in programmes.values()
              if item["kind"] == "episode"
          )

          print(
              f"Checking metadata for {episode_count} "
              "identified TV episodes."
          )

          for index, item in enumerate(
              programmes.values(),
              start=1,
          ):
              if item["kind"] == "episode":
                  enrich_episode(item)

              if index % 25 == 0:
                  print(
                      f"Processed metadata for {index}/"
                      f"{len(programmes)} listings."
                  )

          # ------------------------------------------------------------
          # CHANNEL LOGO
          # ------------------------------------------------------------

          if (
              not channel_logo_url
              and CONFIGURED_LOGO_URL.startswith(
                  ("https://", "http://")
              )
          ):
              channel_logo_url = CONFIGURED_LOGO_URL

          if channel_logo_url:
              print(
                  f"Channel logo configured: {channel_logo_url}"
              )
          else:
              print(
                  "WARNING: Plex did not provide channel artwork "
                  "and MGM_HORROR_LOGO_URL is not configured. "
                  "The guide will be generated without a channel logo."
              )

          # ------------------------------------------------------------
          # BUILD XMLTV
          # ------------------------------------------------------------

          def xmltv_time(timestamp):
              return datetime.fromtimestamp(
                  timestamp,
                  timezone.utc,
              ).strftime("%Y%m%d%H%M%S +0000")

          tv = ET.Element("tv", {
              "source-info-name": "Plex EPG",
              "generator-info-name": "festy-epg MGM Horror",
          })

          channel = ET.SubElement(
              tv,
              "channel",
              {"id": XMLTV_CHANNEL_ID},
          )

          if channel_logo_url:
              ET.SubElement(
                  channel,
                  "icon",
                  {"src": channel_logo_url},
              )

          ET.SubElement(
              channel,
              "display-name",
          ).text = CHANNEL_NAME

          for item in sorted(
              programmes.values(),
              key=lambda entry: (
                  entry["start"],
                  entry["stop"],
              ),
          ):
              programme = ET.SubElement(
                  tv,
                  "programme",
                  {
                      "start": xmltv_time(item["start"]),
                      "stop": xmltv_time(item["stop"]),
                      "channel": XMLTV_CHANNEL_ID,
                  },
              )

              if (
                  item["kind"] == "episode"
                  and item["series"]
              ):
                  # XMLTV programme title is the series name.
                  ET.SubElement(
                      programme,
                      "title",
                      {"lang": "en"},
                  ).text = item["series"]

                  # Episode title is the subtitle.
                  if item["title"]:
                      ET.SubElement(
                          programme,
                          "sub-title",
                          {"lang": "en"},
                      ).text = item["title"]

                  if (
                      item["season"].isdigit()
                      and item["episode"].isdigit()
                  ):
                      season_number = int(item["season"])
                      episode_number = int(item["episode"])

                      if season_number >= 1 and episode_number >= 1:
                          ET.SubElement(
                              programme,
                              "episode-num",
                              {"system": "xmltv_ns"},
                          ).text = (
                              f"{season_number - 1}."
                              f"{episode_number - 1}."
                          )

              else:
                  ET.SubElement(
                      programme,
                      "title",
                      {"lang": "en"},
                  ).text = item["title"]

              if item["summary"]:
                  ET.SubElement(
                      programme,
                      "desc",
                      {"lang": "en"},
                  ).text = item["summary"]

              if item["kind"] == "episode":
                  date_value = item["air_date"]
              else:
                  date_value = item["year"]

              if date_value:
                  ET.SubElement(
                      programme,
                      "date",
                  ).text = date_value

              if item["rating"]:
                  rating_element = ET.SubElement(
                      programme,
                      "rating",
                  )

                  ET.SubElement(
                      rating_element,
                      "value",
                  ).text = item["rating"]

              if item["episode_icon"].startswith(
                  ("https://", "http://")
              ):
                  ET.SubElement(
                      programme,
                      "icon",
                      {"src": item["episode_icon"]},
                  )

          ET.indent(tv, space="  ")

          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          xml_data = ET.tostring(
              tv,
              encoding="utf-8",
              xml_declaration=True,
          )

          with gzip.open(OUTPUT, "wb") as output:
              output.write(xml_data)

          print(f"Created {OUTPUT}")
          print(f"Total programme listings: {len(programmes)}")
          print(f"Identified TV episodes: {episode_count}")
          print(f"Guide window: {DAYS} days")
          PY

      - name: Validate generated guide
        run: |
          python3 - <<'PY'
          import gzip
          import xml.etree.ElementTree as ET

          path = "guides/mgm-horror.xml.gz"
          expected_channel = "mgm-presents-horror"

          with gzip.open(path, "rb") as guide:
              root = ET.parse(guide).getroot()

          channels = root.findall("channel")
          programmes = root.findall("programme")

          if not channels:
              raise SystemExit("Guide has no channel element.")

          if not programmes:
              raise SystemExit("Guide has no programme listings.")

          matching_channels = [
              channel
              for channel in channels
              if channel.get("id") == expected_channel
          ]

          if not matching_channels:
              raise SystemExit(
                  f"Expected channel {expected_channel!r} not found."
              )

          # IMPORTANT:
          # Check for a missing element with "is None".
          # Do not use "if not element": a valid XML element with
          # text and no child elements can evaluate as false.
          for index, programme in enumerate(
              programmes,
              start=1,
          ):
              if not programme.get("start"):
                  raise SystemExit(
                      f"Programme #{index} is missing its start time."
                  )

              if not programme.get("stop"):
                  raise SystemExit(
                      f"Programme #{index} is missing its stop time."
                  )

              if programme.get("channel") != expected_channel:
                  raise SystemExit(
                      f"Programme #{index} has an unexpected "
                      "channel ID."
                  )

              title_element = programme.find("title")

              if title_element is None:
                  start = programme.get("start", "unknown")
                  stop = programme.get("stop", "unknown")

                  raise SystemExit(
                      f"Programme #{index} ({start}–{stop}) "
                      "is missing its title element."
                  )

              if not (title_element.text or "").strip():
                  start = programme.get("start", "unknown")
                  stop = programme.get("stop", "unknown")

                  raise SystemExit(
                      f"Programme #{index} ({start}–{stop}) "
                      "has an empty title."
                  )

          channel = matching_channels[0]
          logo = channel.find("icon")

          print(f"Valid XMLTV: {len(programmes)} programmes")
          print(f"Channel: {channel.get('id')}")
          print(
              "Channel logo: "
              + ("present" if logo is not None else "not configured")
          )
          PY

      - name: Commit updated guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guides/mgm-horror.xml.gz

          if git diff --cached --quiet; then
            echo "Guide has not changed."
            exit 0
          fi

          git commit -m "Update MGM Presents Horror 17-day guide"

          for attempt in 1 2 3; do
            if git push; then
              echo "Guide published successfully."
              exit 0
            fi

            echo "Push attempt ${attempt}/3 failed."

            if [ "$attempt" -lt 3 ]; then
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              sleep $((attempt * 2))
            fi
          done

          echo "Could not publish the updated guide after 3 attempts."
          exit 1
