name: Sports 2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'

permissions:
  contents: write

jobs:
  sports-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify MEGA provider credentials
        env:
          MEGA_XTREAM_URL: ${{ secrets.MEGA_XTREAM_URL }}
          MEGA_XTREAM_USERNAME: ${{ secrets.MEGA_XTREAM_USERNAME }}
          MEGA_XTREAM_PASSWORD: ${{ secrets.MEGA_XTREAM_PASSWORD }}
        run: |
          echo "MEGA provider credentials loaded"

          if [ -z "$MEGA_XTREAM_URL" ]; then
            echo "MEGA_XTREAM_URL is missing"
            exit 1
          fi
          if [ -z "$MEGA_XTREAM_USERNAME" ]; then
            echo "MEGA_XTREAM_USERNAME is missing"
            exit 1
          fi
          if [ -z "$MEGA_XTREAM_PASSWORD" ]; then
            echo "MEGA_XTREAM_PASSWORD is missing"
            exit 1
          fi

          echo "MEGA_XTREAM_URL exists"
          echo "MEGA_XTREAM_USERNAME exists"
          echo "MEGA_XTREAM_PASSWORD exists"

      - name: Install Python dependencies
        run: |
          python -m pip install requests

      - name: Generate Sports 2 guide from MEGA
        env:
          MEGA_XTREAM_URL: ${{ secrets.MEGA_XTREAM_URL }}
          MEGA_XTREAM_USERNAME: ${{ secrets.MEGA_XTREAM_USERNAME }}
          MEGA_XTREAM_PASSWORD: ${{ secrets.MEGA_XTREAM_PASSWORD }}
        run: |
          python config/generate_sports2.py

      - name: Package generated files for publishing
        run: |
          tar -czf /tmp/sports-2-publish.tar.gz guides/sports2.xml

      - name: Upload publish package
        uses: actions/upload-artifact@v4
        with:
          name: sports-2-publish-${{ github.run_id }}
          path: /tmp/sports-2-publish.tar.gz
          retention-days: 1

  publish-sports-2:
    needs: sports-2
    runs-on: ubuntu-latest

    concurrency:
      group: festy-epg-push-queue
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: sports-2-publish-${{ github.run_id }}
          path: /tmp/sports-2-publish

      - name: Publish with retry protection
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PACKAGE="/tmp/sports-2-publish/sports-2-publish.tar.gz"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt"

            git fetch origin main
            git reset --hard origin/main
            tar -xzf "$PACKAGE" -C .

            git add guides/sports2.xml

            if git diff --cached --quiet; then
              echo "No changes to publish"
              exit 0
            fi

            git commit -m "Update Sports 2 guide (MEGA)"

            if git push origin HEAD:main; then
              echo "Publish succeeded"
              exit 0
            fi

            echo "Push failed because main changed or GitHub rejected the push; retrying from newest main..."
            sleep $((attempt * 10))
          done

          echo "Publish failed after 5 attempts"
          exit 1
