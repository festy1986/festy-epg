name: Plex Channel Discovery Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe Plex channel and EPG endpoints
        run: |
          cat > plex_discovery_test.py <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          BASE = "https://epg.provider.plex.tv"
          MGM_GRID_KEY = "6abd4e58a9d133322be5f940"
          TODAY = datetime.now(timezone.utc).date().isoformat()

          headers = {
              "Accept": "application/json",
              "User-Agent": "Plex-Channel-Discovery-Test/1.0",
              "X-Plex-Product": "Plex Channel Discovery Test",
              "X-Plex-Client-Identifier": "plex-channel-discovery-test",
          }

          endpoints = [
              ("provider_root", "/"),
              ("dvr_channels", "/lineups/dvr/channels"),
              ("lineups", "/lineups"),
              ("channels", "/channels"),
              ("watchnow", "/watchnow"),
              ("watchnow_all", "/watchnow/all"),
              ("hubs", "/hubs"),
              (
                  "known_mgm_grid",
                  "/grid?" + urllib.parse.urlencode({
                      "channelGridKey": MGM_GRID_KEY,
                      "date": TODAY,
                      "x-plex-provider-version": "7.0.0",
                  }),
              ),
          ]

          def summarize(value, depth=0):
              if isinstance(value, dict):
                  result = {}
                  for key, item in list(value.items())[:30]:
                      if isinstance(item, (dict, list)):
                          if depth < 2:
                              result[key] = summarize(item, depth + 1)
                          else:
                              result[key] = (
                                  f"object with {len(item)} keys"
                                  if isinstance(item, dict)
                                  else f"array with {len(item)} items"
                              )
                      elif isinstance(item, str):
                          result[key] = item[:250]
                      else:
                          result[key] = item
                  return result
              if isinstance(value, list):
                  return {
                      "item_count": len(value),
                      "first_items": [
                          summarize(x, depth + 1)
                          if isinstance(x, (dict, list))
                          else x
                          for x in value[:2]
                      ],
                  }
              return value

          report = {
              "tested_at_utc": datetime.now(timezone.utc).isoformat(),
              "note": (
                  "Diagnostic only. HTTP errors are recorded, not treated "
                  "as proof that an endpoint does not exist."
              ),
              "results": [],
          }

          for name, path in endpoints:
              url = BASE + path
              entry = {
                  "name": name,
                  "url": url,
              }

              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(
                      request, timeout=15
                  ) as response:
                      raw = response.read()
                      entry["status"] = response.status
                      entry["content_type"] = response.headers.get(
                          "Content-Type", ""
                      )
                      entry["response_bytes"] = len(raw)

                  text = raw.decode("utf-8", errors="replace")

                  try:
                      data = json.loads(text)
                      entry["format"] = "json"
                      entry["top_level_keys"] = (
                          list(data.keys())[:50]
                          if isinstance(data, dict)
                          else None
                      )
                      entry["preview"] = summarize(data)
                  except json.JSONDecodeError:
                      entry["format"] = "non-json"
                      entry["body_preview"] = text[:1500]

              except urllib.error.HTTPError as exc:
                  body = exc.read(1500).decode(
                      "utf-8", errors="replace"
                  )
                  entry["status"] = exc.code
                  entry["error"] = str(exc.reason)
                  entry["body_preview"] = body

              except Exception as exc:
                  entry["error"] = f"{type(exc).__name__}: {exc}"

              report["results"].append(entry)
              print(
                  f"{name}: HTTP {entry.get('status', 'N/A')} "
                  f"{entry.get('error', '')}"
              )

          os.makedirs("plex-discovery-report", exist_ok=True)
          output = "plex-discovery-report/report.json"

          with open(output, "w", encoding="utf-8") as file:
              json.dump(report, file, indent=2, ensure_ascii=False)

          print(f"\nReport saved to {output}")
          print("\nEndpoint summary:")
          for entry in report["results"]:
              print(json.dumps({
                  "name": entry["name"],
                  "status": entry.get("status"),
                  "top_level_keys": entry.get("top_level_keys"),
                  "error": entry.get("error"),
              }))
          PY

          python plex_discovery_test.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plex-channel-discovery-report
          path: plex-discovery-report/report.json
          if-no-files-found: warn
          retention-days: 17
