name: Xumo Master Catalog (Temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xumo-master-catalog
  cancel-in-progress: false

jobs:
  build-xumo-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover Xumo channels and logos
        run: |
          mkdir -p guides
          node <<'EOF'
          const fs = require('fs')

          const BASE = 'https://valencia-app-mds.xumo.com/v2'
          const CATALOG_URL = `${BASE}/channels/list/10006.json?sort=hybrid&geoId=unknown`
          const PAGE_SIZE = 50
          const MAX_OFFSETS = 40 // safety cap: up to 2,000 channel slots

          function xmlEscape(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;')
          }
          function csvEscape(value) {
            const s = String(value ?? '')
            return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s
          }
          function slug(value) {
            return String(value || 'channel').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'channel'
          }
          function findImageUrls(value, keyPath = '', out = []) {
            if (!value || typeof value !== 'object') return out
            if (Array.isArray(value)) {
              for (const item of value) findImageUrls(item, keyPath, out)
              return out
            }
            for (const [key, child] of Object.entries(value)) {
              const path = keyPath ? `${keyPath}.${key}` : key
              if (typeof child === 'string' && /^https?:\/\//i.test(child) && /(logo|image|artwork|poster|thumbnail|thumb|icon|tile|brand|visual)/i.test(path)) {
                out.push({ url: child, key: path, score: scoreImagePath(path, child) })
              } else if (child && typeof child === 'object') {
                findImageUrls(child, path, out)
              }
            }
            return out
          }
          function scoreImagePath(path, url) {
            let score = 0
            if (/logo/i.test(path)) score += 100
            if (/channel.*(logo|image)|(?:logo|image).*channel/i.test(path)) score += 50
            if (/tile|brand|icon/i.test(path)) score += 25
            if (/poster|thumbnail|thumb/i.test(path)) score += 10
            if (/\.svg(?:\?|$)/i.test(url)) score += 5
            if (/\.(?:png|webp)(?:\?|$)/i.test(url)) score += 3
            return score
          }
          function getChannelId(item) {
            return item?.channelId ?? item?.id ?? item?.guid?.value ?? item?.guid ?? ''
          }
          function getTitle(item) {
            return item?.title ?? item?.name ?? item?.displayName ?? item?.channelName ?? ''
          }
          function chooseLogo(item) {
            const candidates = findImageUrls(item).sort((a, b) => b.score - a.score)
            return candidates[0]?.url || ''
          }
          async function getJson(url) {
            const response = await fetch(url, { headers: { accept: 'application/json' } })
            if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`)
            return response.json()
          }

          ;(async () => {
            console.log(`Fetching Xumo channel metadata: ${CATALOG_URL}`)
            const catalogJson = await getJson(CATALOG_URL)
            const catalogItems = catalogJson?.channel?.item
            if (!Array.isArray(catalogItems)) {
              throw new Error(`Unexpected Xumo catalog response. Top-level keys: ${Object.keys(catalogJson || {}).join(', ')}`)
            }
            console.log(`Xumo metadata catalog returned ${catalogItems.length} entries`)

            const catalogById = new Map()
            for (const item of catalogItems) {
              const id = String(item?.guid?.value ?? getChannelId(item) ?? '')
              if (id) catalogById.set(id, item)
            }

            const discovered = new Map()
            let emptyPages = 0
            for (let page = 0; page < MAX_OFFSETS; page++) {
              const offset = page * PAGE_SIZE
              const url = `${BASE}/epg/10006/19700101/0.json?limit=${PAGE_SIZE}&offset=${offset}`
              let payload
              try {
                payload = await getJson(url)
              } catch (error) {
                console.warn(`Could not read EPG catalog page at offset ${offset}: ${error.message}`)
                break
              }
              const rows = payload?.channels
              if (!Array.isArray(rows) || rows.length === 0) {
                emptyPages++
                console.log(`No channels at offset ${offset}; reached end of catalog`)
                break
              }
              for (const row of rows) {
                const id = String(row?.channelId ?? '')
                if (!id) continue
                const info = catalogById.get(id) || {}
                const name = String(getTitle(info) || row?.title || row?.name || `Xumo channel ${id}`).trim()
                const siteId = `${offset}#${id}`
                const logoCandidates = findImageUrls(info).sort((a, b) => b.score - a.score)
                const logo = logoCandidates[0]?.url || ''
                const allLogoUrls = [...new Set(logoCandidates.map(x => x.url))]
                const key = id
                const existing = discovered.get(key)
                const entry = {
                  name,
                  channel_id: id,
                  site_id: siteId,
                  site: 'xumo.tv',
                  lang: 'en',
                  xmltv_id: `Xumo.${slug(name)}`,
                  logo_url: logo,
                  logo_urls: allLogoUrls,
                  catalog_match: Boolean(catalogById.has(id)),
                  logo_found: Boolean(logo),
                  source_offset: offset
                }
                if (!existing || (!existing.logo_url && entry.logo_url) || (!existing.catalog_match && entry.catalog_match)) discovered.set(key, entry)
              }
              console.log(`Offset ${offset}: ${rows.length} channel IDs; total unique ${discovered.size}`)
              if (rows.length < PAGE_SIZE) {
                console.log('Page shorter than requested size; reached end of catalog')
                break
              }
            }

            const channels = [...discovered.values()].sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }))
            if (!channels.length) throw new Error('No Xumo channel IDs were discovered; refusing to write an empty catalog')

            const csvHeader = ['name','channel_id','site_id','site','lang','xmltv_id','logo_url','all_logo_urls','catalog_match','logo_found','source_offset']
            const csvRows = [csvHeader, ...channels.map(c => [c.name,c.channel_id,c.site_id,c.site,c.lang,c.xmltv_id,c.logo_url,c.logo_urls.join(' | '),c.catalog_match,c.logo_found,c.source_offset])]
            fs.writeFileSync('guides/xumo-master-channels.csv', csvRows.map(row => row.map(csvEscape).join(',')).join('\n') + '\n')
            fs.writeFileSync('guides/xumo-master-channels.json', JSON.stringify({ generated_at: new Date().toISOString(), source: CATALOG_URL, count: channels.length, channels }, null, 2) + '\n')

            const xml = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<channels>',
              ...channels.map(c => {
                const attrs = `site="xumo.tv" lang="en" xmltv_id="${xmlEscape(c.xmltv_id)}" site_id="${xmlEscape(c.site_id)}"`
                const icon = c.logo_url ? `<icon src="${xmlEscape(c.logo_url)}" />` : ''
                return `  <channel ${attrs}>${icon}${xmlEscape(c.name)}</channel>`
              }),
              '</channels>',
              ''
            ].join('\n')
            fs.writeFileSync('guides/xumo-master-channels.xml', xml)

            const logoCount = channels.filter(c => c.logo_url).length
            const noLogo = channels.filter(c => !c.logo_url).map(c => `${c.name} (${c.channel_id})`)
            const unmatched = channels.filter(c => !c.catalog_match).map(c => `${c.name} (${c.channel_id})`)
            fs.writeFileSync('guides/xumo-master-summary.txt', [
              `Generated: ${new Date().toISOString()}`,
              `Unique channel IDs discovered from Xumo EPG index: ${channels.length}`,
              `Matched to Xumo channel metadata catalog: ${channels.filter(c => c.catalog_match).length}`,
              `Channels with a detected logo URL: ${logoCount}`,
              `Channels without a detected logo URL: ${noLogo.length}`,
              '', 'CHANNELS WITHOUT LOGO URL:', ...(noLogo.length ? noLogo : ['None']),
              '', 'CHANNEL IDs NOT MATCHED TO METADATA CATALOG:', ...(unmatched.length ? unmatched : ['None']), ''
            ].join('\n'))

            console.log(`Wrote CSV, JSON, XML and summary for ${channels.length} unique Xumo channels; ${logoCount} have detected logo URLs`)
            if (noLogo.length) console.warn(`${noLogo.length} channels have no detected logo URL; review guides/xumo-master-summary.txt`)
          })().catch(error => { console.error(error.stack || error); process.exit(1) })
          EOF

      - name: Validate master catalog files
        run: |
          test -s guides/xumo-master-channels.csv
          test -s guides/xumo-master-channels.json
          test -s guides/xumo-master-channels.xml
          test -s guides/xumo-master-summary.txt
          node -e "const d=require('./guides/xumo-master-channels.json'); if (!d.channels?.length) process.exit(1); console.log('Validated', d.channels.length, 'channels')"

      - name: Commit master catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides/xumo-master-channels.csv guides/xumo-master-channels.json guides/xumo-master-channels.xml guides/xumo-master-summary.txt
          if git diff --cached --quiet; then
            echo "No changes to Xumo master catalog"
          else
            git commit -m "Build Xumo master channel catalog"
            git push
          fi
