
name: Plex FAST Channel Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Discover Plex FAST channel catalog
        env:
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          base = "https://epg.provider.plex.tv"
          out = Path("plex-fast-discovery")
          out.mkdir(exist_ok=True)

          token = os.environ.get("PLEX_TOKEN", "").strip()
          if not token:
              raise SystemExit("PLEX_TOKEN secret is missing.")

          headers = {
              "Accept": "application/json",
              "X-Plex-Token": token,
              "X-Plex-Client-Identifier": "festy-epg-fast-discovery",
              "X-Plex-Product": "Festy EPG Discovery",
              "X-Plex-Version": "1.0",
          }

          genres = [
              "featured",
              "bingeworthy", "movies", "crime", "news", "sports",
              "reality", "classic-tv", "adrenaline-sci-fi", "comedy",
              "daytime-tv-games", "explore", "food-home-culture",
              "kids-family", "en-espanol", "global", "music",
          ]

          report = {
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "catalog_base": base,
              "results": [],
          }

          for genre in genres:
              if genre == "featured":
                  path = "/lineups/plex/channels/featured"
              else:
                  path = "/lineups/plex/channels?genre=" + genre

              request = urllib.request.Request(
                  base + path,
                  headers=headers,
                  method="GET",
              )

              entry = {
                  "genre": genre,
                  "path": path,
              }

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      status = response.status
                      content_type = response.headers.get("Content-Type", "")
                      entry["http_status"] = status
                      entry["content_type"] = content_type
                      entry["bytes"] = len(body)

                  suffix = ".json" if "json" in content_type.lower() else ".xml"
                  filename = out / (genre + suffix)
                  filename.write_bytes(body)
                  entry["saved_file"] = filename.name

                  try:
                      data = json.loads(body)
                      entry["top_level_keys"] = (
                          list(data.keys()) if isinstance(data, dict) else []
                      )
                  except (ValueError, UnicodeDecodeError):
                      entry["json_parse"] = "not JSON; raw response saved"

                  print(f"{genre}: HTTP {status}, {len(body)} bytes")

              except urllib.error.HTTPError as error:
                  body = error.read()
                  entry["http_status"] = error.code
                  entry["error"] = "HTTP error; response saved"
                  (out / (genre + "-error.txt")).write_bytes(body)
                  print(f"{genre}: HTTP {error.code}")

              except Exception as error:
                  entry["error"] = type(error).__name__
                  print(f"{genre}: request failed ({type(error).__name__})")

              report["results"].append(entry)

          (out / "report.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8",
          )

          successful = [
              r for r in report["results"]
              if r.get("http_status") == 200
          ]
          print(f"Successful catalog requests: {len(successful)}/{len(genres)}")
          PY

      - name: Upload discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plex-fast-channel-discovery
          path: plex-fast-discovery/
          if-no-files-found: warn
          retention-days: 7
