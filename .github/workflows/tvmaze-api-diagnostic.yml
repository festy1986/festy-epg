name: TVMaze API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvmaze-api-diagnostic
  cancel-in-progress: false

jobs:
  test-tvmaze:
    name: Test TVMaze API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test TVMaze API endpoints independently
        shell: bash
        run: |
          node <<'EOF'
          const BASE = 'https://api.tvmaze.com';
          const TIMEOUT_MS = 15000;
          const PAUSE_MS = 2000;

          const checks = [
            {
              name: 'Show search',
              path: '/search/shows?q=game%20of%20thrones',
              validate(data) {
                if (!Array.isArray(data)) {
                  throw new Error(`Expected array, got ${typeof data}`);
                }
                if (
                  data.length > 0 &&
                  (!data[0].show ||
                   typeof data[0].show.id !== 'number' ||
                   typeof data[0].show.name !== 'string')
                ) {
                  throw new Error(
                    'Unexpected search result structure; expected result.show.id and result.show.name'
                  );
                }
                return `Array with ${data.length} show search result(s)`;
              }
            },
            {
              name: 'Show details',
              path: '/shows/82',
              validate(data) {
                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                  throw new Error(`Expected JSON object, got ${Array.isArray(data) ? 'array' : typeof data}`);
                }
                if (typeof data.id !== 'number' || typeof data.name !== 'string') {
                  throw new Error('Expected numeric id and string name fields');
                }
                return `Show id=${data.id}, name=${JSON.stringify(data.name)}`;
              }
            },
            {
              name: 'Episode list',
              path: '/shows/82/episodes',
              validate(data) {
                if (!Array.isArray(data)) {
                  throw new Error(`Expected array, got ${typeof data}`);
                }
                if (
                  data.length > 0 &&
                  (typeof data[0].id !== 'number' ||
                   typeof data[0].name !== 'string')
                ) {
                  throw new Error(
                    'Unexpected episode structure; expected episode.id and episode.name'
                  );
                }
                return `Array with ${data.length} episode(s)`;
              }
            }
          ];

          async function runCheck(check) {
            const url = `${BASE}${check.path}`;
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
            const started = Date.now();

            console.log('');
            console.log(`=== ${check.name} ===`);
            console.log(`GET ${url}`);

            try {
              const response = await fetch(url, {
                headers: {
                  Accept: 'application/json',
                  'User-Agent': 'festy-epg-tvmaze-api-diagnostic/1.1'
                },
                signal: controller.signal
              });

              const elapsed = Date.now() - started;
              console.log(`HTTP status: ${response.status}`);
              console.log(`Elapsed: ${elapsed} ms`);
              console.log(`Content-Type: ${response.headers.get('content-type') || '(missing)'}`);

              for (const header of [
                'retry-after',
                'x-ratelimit-limit',
                'x-ratelimit-remaining',
                'x-ratelimit-reset'
              ]) {
                const value = response.headers.get(header);
                if (value !== null) console.log(`${header}: ${value}`);
              }

              const body = await response.text();

              if (!response.ok) {
                console.log(`Response body (first 500 chars): ${body.slice(0, 500)}`);
                throw new Error(`HTTP ${response.status}`);
              }

              let data;
              try {
                data = JSON.parse(body);
              } catch (error) {
                console.log(`Response body (first 500 chars): ${body.slice(0, 500)}`);
                throw new Error(`Invalid JSON: ${error.message}`);
              }

              console.log(`Schema check: ${check.validate(data)}`);
              console.log('RESULT: PASS');
              return true;
            } catch (error) {
              if (error.name === 'AbortError') {
                console.log(`RESULT: FAIL — request timed out after ${TIMEOUT_MS} ms`);
              } else {
                console.log(`RESULT: FAIL — ${error.stack || error.message || String(error)}`);
              }
              return false;
            } finally {
              clearTimeout(timer);
            }
          }

          async function main() {
            console.log(`Diagnostic started: ${new Date().toISOString()}`);
            console.log('Each endpoint is tested independently; a failure will not stop later tests.');

            const results = [];
            for (let i = 0; i < checks.length; i++) {
              const passed = await runCheck(checks[i]);
              results.push({ name: checks[i].name, passed });

              if (i < checks.length - 1) {
                await new Promise(resolve => setTimeout(resolve, PAUSE_MS));
              }
            }

            console.log('');
            console.log('=== SUMMARY ===');
            for (const result of results) {
              console.log(`${result.passed ? 'PASS' : 'FAIL'}: ${result.name}`);
            }
            console.log(`Endpoints tested: ${results.length}`);
            console.log(`Failures: ${results.filter(result => !result.passed).length}`);
            console.log(`Finished: ${new Date().toISOString()}`);

            if (results.some(result => !result.passed)) {
              process.exitCode = 1;
            } else {
              console.log('All tested endpoints responded and matched the expected basic schema.');
            }
          }

          main().catch(error => {
            console.error('Diagnostic script error:', error.stack || error);
            process.exitCode = 1;
          });
          EOF
