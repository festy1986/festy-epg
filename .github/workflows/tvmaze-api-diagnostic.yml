
name: TVMaze API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvmaze-api-diagnostic
  cancel-in-progress: false

jobs:
  test-tvmaze:
    name: Test TVMaze API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test TVMaze API endpoints
        shell: bash
        run: |
          node <<'EOF'
          const BASE = 'https://api.tvmaze.com';
          const TIMEOUT_MS = 15000;
          const PAUSE_MS = 2000;
          let failures = 0;

          const checks = [
            {
              name: 'Show search',
              path: '/search/shows?q=game%20of%20thrones',
              validate(data) {
                if (!Array.isArray(data)) {
                  throw new Error('Expected an array');
                }

                if (
                  data.length &&
                  (!data[0].show ||
                   typeof data[0].show.id !== 'number' ||
                   !data[0].show.name)
                ) {
                  throw new Error(
                    'Unexpected search response: expected result.show.id and result.show.name'
                  );
                }

                return `Array; ${data.length} result(s)`;
              }
            },
            {
              name: 'Show details',
              path: '/shows/82',
              validate(data) {
                if (
                  !data ||
                  typeof data !== 'object' ||
                  Array.isArray(data)
                ) {
                  throw new Error('Expected a JSON object');
                }

                if (
                  typeof data.id !== 'number' ||
                  typeof data.name !== 'string'
                ) {
                  throw new Error('Expected numeric id and string name');
                }

                return `ID=${data.id}; name=${JSON.stringify(data.name)}`;
              }
            },
            {
              name: 'Episode list',
              path: '/shows/82/episodes',
              validate(data) {
                if (!Array.isArray(data)) {
                  throw new Error('Expected an array');
                }

                if (
                  data.length &&
                  (typeof data[0].id !== 'number' ||
                   typeof data[0].name !== 'string')
                ) {
                  throw new Error(
                    'Unexpected episode response: expected episode.id and episode.name'
                  );
                }

                return `Array; ${data.length} episode(s)`;
              }
            }
          ];

          async function runCheck(check) {
            const url = `${BASE}${check.path}`;
            const controller = new AbortController();
            const timer = setTimeout(
              () => controller.abort(),
              TIMEOUT_MS
            );
            const started = Date.now();

            console.log('');
            console.log(`=== ${check.name} ===`);
            console.log(`GET ${url}`);

            try {
              const response = await fetch(url, {
                headers: {
                  Accept: 'application/json',
                  'User-Agent': 'festy-epg-tvmaze-api-diagnostic/1.0'
                },
                signal: controller.signal
              });

              console.log(`HTTP status: ${response.status}`);
              console.log(`Elapsed: ${Date.now() - started} ms`);
              console.log(
                `Content-Type: ${response.headers.get('content-type') || '(missing)'}`
              );

              for (const header of [
                'retry-after',
                'x-ratelimit-limit',
                'x-ratelimit-remaining',
                'x-ratelimit-reset'
              ]) {
                const value = response.headers.get(header);
                if (value !== null) {
                  console.log(`${header}: ${value}`);
                }
              }

              const body = await response.text();

              if (!response.ok) {
                console.log(
                  `Response body: ${body.slice(0, 500)}`
                );
                throw new Error(`HTTP ${response.status}`);
              }

              let data;

              try {
                data = JSON.parse(body);
              } catch {
                console.log(
                  `Response was not JSON: ${body.slice(0, 500)}`
                );
                throw new Error('Invalid JSON response');
              }

              console.log(
                `JSON type: ${Array.isArray(data) ? 'array' : typeof data}`
              );
              console.log(`Schema check: ${check.validate(data)}`);
              console.log('RESULT: PASS');

            } catch (error) {
              failures++;

              if (error.name === 'AbortError') {
                console.log(
                  `RESULT: FAIL — timed out after ${TIMEOUT_MS} ms`
                );
              } else {
                console.log(
                  `RESULT: FAIL — ${error.message || String(error)}`
                );
              }
            } finally {
              clearTimeout(timer);
            }
          }

          async function main() {
            console.log(
              `Diagnostic started: ${new Date().toISOString()}`
            );
            console.log(
              'Requests run sequentially to avoid unnecessary API traffic.'
            );

            for (let i = 0; i < checks.length; i++) {
              await runCheck(checks[i]);

              if (i < checks.length - 1) {
                await new Promise(resolve =>
                  setTimeout(resolve, PAUSE_MS)
                );
              }
            }

            console.log('');
            console.log('=== SUMMARY ===');
            console.log(`Endpoints tested: ${checks.length}`);
            console.log(`Failures: ${failures}`);
            console.log(
              `Finished: ${new Date().toISOString()}`
            );

            if (failures > 0) {
              console.log(
                'CONCLUSION: One or more requests failed or returned an unexpected response.'
              );
              process.exitCode = 1;
            } else {
              console.log(
                'CONCLUSION: All tested endpoints responded successfully and matched the expected basic schema.'
              );
            }
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          EOF
