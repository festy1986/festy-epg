name: Build Plex Master List

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build-master-list:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download existing Plex discovery data
        uses: actions/download-artifact@v4
        with:
          name: plex-fast-channel-discovery
          repository: ${{ github.repository }}
          run-id: 38839675247
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: plex-fast-discovery

      - name: Refresh catalog and build master list
        env:
          PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("plex-fast-discovery")
          config = Path("config")
          config.mkdir(exist_ok=True)

          base = "https://epg.provider.plex.tv"
          token = os.environ.get("PLEX_TOKEN", "").strip()

          genres = [
              "featured", "bingeworthy", "movies", "crime", "news",
              "sports", "reality", "classic-tv", "adrenaline-sci-fi",
              "comedy", "daytime-tv-games", "explore",
              "food-home-culture", "kids-family", "en-espanol",
              "global", "music",
          ]

          headers = {
              "Accept": "application/json",
              "X-Plex-Token": token,
              "X-Plex-Client-Identifier": "festy-epg-master-list",
              "X-Plex-Product": "Plex Master List",
              "X-Plex-Version": "1.0",
          }

          # Keep the previously downloaded catalog as a fallback.
          # Refresh each category when the temporary token still works.
          if token:
              for genre in genres:
                  if genre == "featured":
                      path = "/lineups/plex/channels/featured"
                  else:
                      path = "/lineups/plex/channels?genre=" + genre

                  request = urllib.request.Request(
                      base + path, headers=headers
                  )
                  try:
                      with urllib.request.urlopen(
                          request, timeout=25
                      ) as response:
                          body = response.read()
                          if response.status == 200:
                              (root / (genre + ".json")).write_bytes(body)
                              print(f"Refreshed {genre}")
                  except Exception as exc:
                      # Existing artifact remains available as fallback.
                      print(f"Using saved {genre} data: {type(exc).__name__}")

              # Also try the unfiltered catalog endpoint.
              # If supported, it may reveal channels absent from categories.
              request = urllib.request.Request(
                  base + "/lineups/plex/channels",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(
                      request, timeout=25
                  ) as response:
                      if response.status == 200:
                          (root / "all-channels.json").write_bytes(
                              response.read()
                          )
                          print("Unfiltered catalog endpoint succeeded")
              except Exception as exc:
                  print(
                      "Unfiltered endpoint unavailable: "
                      + type(exc).__name__
                  )

          # Combine all returned channels, deduplicating by Plex channel ID
          # or grid key. Retain every category in which a channel appears.
          channels = {}

          for file in sorted(root.glob("*.json")):
              if file.name == "report.json":
                  continue
              try:
                  data = json.loads(file.read_text(encoding="utf-8"))
              except Exception:
                  continue

              container = data.get("MediaContainer", {})
              category = container.get("title", file.stem)
              items = container.get("Channel", [])

              if not isinstance(items, list):
                  continue

              print(f"{file.name}: {len(items)} channels")

              for item in items:
                  if not isinstance(item, dict):
                      continue

                  grid_key = item.get("gridKey", "")
                  plex_id = item.get("id", "")
                  identity = plex_id or grid_key
                  if not identity:
                      continue

                  if identity not in channels:
                      channels[identity] = {
                          "name": item.get("title", ""),
                          "plex_id": plex_id,
                          "grid_key": grid_key,
                          "call_sign": item.get("callSign", ""),
                          "slug": item.get("slug", ""),
                          "logo": item.get("thumb", ""),
                          "art": item.get("art", ""),
                          "poster": item.get("coverPoster", ""),
                          "summary": item.get("summary", ""),
                          "language": item.get("language", "en"),
                          "is_hd": item.get("isHd"),
                          "hidden": item.get("hidden"),
                          "categories": [],
                      }

                  record = channels[identity]

                  # Fill missing fields from other category results.
                  mappings = {
                      "name": "title",
                      "plex_id": "id",
                      "grid_key": "gridKey",
                      "call_sign": "callSign",
                      "slug": "slug",
                      "logo": "thumb",
                      "art": "art",
                      "poster": "coverPoster",
                      "summary": "summary",
                      "language": "language",
                      "is_hd": "isHd",
                      "hidden": "hidden",
                  }

                  for target, source in mappings.items():
                      if not record.get(target) and item.get(source):
                          record[target] = item[source]

                  if category not in record["categories"]:
                      record["categories"].append(category)

          # Add a stable XMLTV ID based on the Plex slug.
          # If slugs collide, append the grid key to keep IDs unique.
          used_ids = set()
          ordered = sorted(
              channels.values(),
              key=lambda c: (c.get("name") or "").casefold()
          )

          for record in ordered:
              slug = record.get("slug") or record.get("name") or record.get("grid_key")
              xmltv_id = re.sub(
                  r"[^a-z0-9]+", "-", slug.lower()
              ).strip("-")

              if not xmltv_id:
                  xmltv_id = record.get("grid_key") or "plex-channel"

              if xmltv_id in used_ids:
                  suffix = record.get("grid_key") or record.get("plex_id", "")
                  xmltv_id = xmltv_id + "-" + suffix[-8:]

              used_ids.add(xmltv_id)
              record["xmltv_id"] = xmltv_id
              record["site"] = "plex.tv"
              record["site_id"] = record.get("grid_key", "")

          fields = [
              "name", "site", "site_id", "plex_id", "grid_key",
              "xmltv_id", "call_sign", "slug", "logo", "art",
              "poster", "summary", "language", "is_hd", "hidden",
              "categories",
          ]

          # JSON master list: retains all useful Plex metadata.
          (config / "Plex Master List.json").write_text(
              json.dumps(ordered, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )

          # CSV master list: convenient for viewing in Excel.
          with (config / "Plex Master List.csv").open(
              "w", newline="", encoding="utf-8-sig"
          ) as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for record in ordered:
                  row = record.copy()
                  row["categories"] = "; ".join(row["categories"])
                  writer.writerow({key: row.get(key, "") for key in fields})

          # XMLTV-compatible channel declarations, using the same
          # display-name and icon convention as the MGM horror guide.
          tv = ET.Element("tv", {
              "generator-info-name": "Plex Master List"
          })

          for record in ordered:
              channel = ET.SubElement(
                  tv, "channel", {"id": record["xmltv_id"]}
              )
              ET.SubElement(channel, "display-name").text = (
                  record.get("name") or record["xmltv_id"]
              )
              if record.get("logo"):
                  ET.SubElement(
                      channel, "icon", {"src": record["logo"]}
                  )

          ET.indent(tv, space="  ")
          ET.ElementTree(tv).write(
              config / "Plex Master List.xml",
              encoding="utf-8",
              xml_declaration=True,
          )

          print()
          print(f"Unique channels found: {len(ordered)}")
          print(f"Channels with grid keys: {sum(bool(c.get('grid_key')) for c in ordered)}")
          print(f"Channels with logos: {sum(bool(c.get('logo')) for c in ordered)}")
          print(f"Channels with missing logos: {sum(not bool(c.get('logo')) for c in ordered)}")
          print("Created:")
          print("  config/Plex Master List.json")
          print("  config/Plex Master List.csv")
          print("  config/Plex Master List.xml")
          print("Note: completeness depends on the channels exposed by Plex.")
          PY

      - name: Commit Plex Master List to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            "config/Plex Master List.json" \
            "config/Plex Master List.csv" \
            "config/Plex Master List.xml"

          if git diff --cached --quiet; then
            echo "Plex Master List is already up to date."
          else
            git commit -m "Build Plex Master List"
            git push
          fi

      - name: Upload master list as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plex-Master-List
          path: config/Plex Master List.*
          retention-days: 30
